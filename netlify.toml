[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://storage.googleapis.com https://images.ygoprodeck.com https://cdn.discordapp.com https://lh3.googleusercontent.com https://*.googleusercontent.com https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://yrp-10714964039.europe-west1.run.app https://db.ygoprodeck.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; media-src 'self' blob: https://storage.googleapis.com; object-src 'none'; frame-ancestors 'none';"

# suggestion-form.html is an HTML fragment injected by card-loader.js, not a page.
# It has no <head>, so it can't carry a robots meta tag — keep it out of the index here.
[[headers]]
  for = "/pages/suggestion-form.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Block access to git folder
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

# Block access to environment files
[[redirects]]
  from = "/*.env*"
  to = "/404.html"
  status = 404
  force = true

# Block access to package files
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Block access to node_modules
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

# Block access to source scripts that shouldn't be public
# Assuming scripts/ folder contains build/maintenance scripts, not frontend assets
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Block access to source documents, dev tooling and internal notes.

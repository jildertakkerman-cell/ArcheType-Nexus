[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# suggestion-form.html is an HTML fragment injected by card-loader.js, not a page.
# It has no <head>, so it can't carry a robots meta tag — keep it out of the index here.
[[headers]]
  for = "/pages/suggestion-form.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Block access to git folder
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

# Block access to environment files
[[redirects]]
  from = "/*.env*"
  to = "/404.html"
  status = 404
  force = true

# Block access to package files
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Block access to node_modules
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

# Block access to source scripts that shouldn't be public
# Assuming scripts/ folder contains build/maintenance scripts, not frontend assets
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Block access to source documents, dev tooling and internal notes.
# Nothing on the site links to or fetches from these folders.
[[redirects]]
  from = "/word/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dev/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.agent/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.vscode/*"
  to = "/404.html"
  status = 404
  force = true

# Block root-level maintenance files
[[redirects]]
  from = "/update-titles.ps1"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/pages_list.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fix-css-order.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/chk_1.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/chk_2.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/chk_3.js"
  to = "/404.html"
  status = 404

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Block access to git folder
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

# Block access to environment files
[[redirects]]
  from = "/*.env*"
  to = "/404.html"
  status = 404
  force = true

# Block access to package files
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Block access to node_modules
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

# Block access to source scripts that shouldn't be public
# Assuming scripts/ folder contains build/maintenance scripts, not frontend assets
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

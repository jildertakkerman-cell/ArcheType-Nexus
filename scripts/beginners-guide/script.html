            // ---------- How to read a card ----------
            function initReadCard() {
                var root = document.getElementById('nb-read-card');
                if (!root) return;
                var spotsBox = document.getElementById('rc-spots');
                var imgBox = document.getElementById('rc-img-container');
                var spots = $$('.rc__spot', root);
                var parts = $$('#rc-parts li[data-part]');

                var caption = document.getElementById('rc-caption');

                // Copies an explanation into a caption (shown on phones, where the
                // full list sits below the card or text, out of sight).
                function mirror(target, source) {
                    if (!target || !source) return;
                    target.textContent = '';
                    [].slice.call(source.childNodes).forEach(function (n) { target.appendChild(n.cloneNode(true)); });
                    target.hidden = false;
                }

                function selectPart(key) {
                    spots.forEach(function (s) { s.setAttribute('aria-pressed', s.dataset.part === key ? 'true' : 'false'); });
                    parts.forEach(function (li) { li.classList.toggle('is-on', li.dataset.part === key); });
                    mirror(caption, parts.filter(function (p) { return p.dataset.part === key; })[0]);
                }
                spots.forEach(function (s) {
                    s.addEventListener('click', function (event) {
                        // The card image under the spots opens CardLoader's popup; a spot shouldn't.
                        event.stopPropagation();
                        selectPart(s.dataset.part);
                    });
                });

                // The spots only line up over the real card image, so they wait for it.
                function showSpotsWhenLoaded() {
                    var img = imgBox.querySelector('img');
                    if (!img) return false;
                    var show = function () { spotsBox.hidden = false; };
                    if (img.complete && img.naturalWidth) show();
                    else img.addEventListener('load', show);
                    return true;
                }
                if (hasCardLoader()) {
                    loadWhenNear('read-card', { 'rc-img-container': 'Ash Blossom & Joyous Spring' });
                    if (!showSpotsWhenLoaded() && 'MutationObserver' in window) {
                        var watcher = new MutationObserver(function () {
                            if (showSpotsWhenLoaded()) watcher.disconnect();
                        });
                        watcher.observe(imgBox, { childList: true, subtree: true });
                    }
                }

                // Card text: each coloured part lights up its explanation.
                var segs = $$('#rc-text .rc-seg');
                var legend = $$('#rc-legend > div[data-seg]');
                var textCaption = document.getElementById('rc-text-caption');
                function selectSeg(key) {
                    segs.forEach(function (s) { s.classList.toggle('is-on', s.dataset.seg === key); });
                    legend.forEach(function (d) { d.classList.toggle('is-on', d.dataset.seg === key); });
                    var row = legend.filter(function (d) { return d.dataset.seg === key; })[0];
                    if (row && textCaption) {
                        textCaption.dataset.seg = key;
                        textCaption.textContent = '';
                        var dt = $('dt', row);
                        var dd = $('dd', row);
                        var strong = el('strong');
                        if (dt) [].slice.call(dt.childNodes).forEach(function (n) { strong.appendChild(n.cloneNode(true)); });
                        textCaption.appendChild(strong);
                        textCaption.appendChild(document.createTextNode(': '));
                        if (dd) [].slice.call(dd.childNodes).forEach(function (n) { textCaption.appendChild(n.cloneNode(true)); });
                        textCaption.hidden = false;
                    }
                }
                segs.forEach(function (s) {
                    s.addEventListener('click', function () { selectSeg(s.dataset.seg); });
                    s.addEventListener('keydown', function (event) {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            selectSeg(s.dataset.seg);
                        }
                    });
                });
            }

            // ---------- Watch a turn ----------
            // Cards checked against YGOProDeck on 4 October 2026.
            var TURN_CARDS = {
                rota: { name: 'Reinforcement of the Army', frame: 'spell' },
                mf: { name: 'Mirror Force', frame: 'trap' },
                kuriboh: { name: 'Kuriboh', frame: 'effect', atk: 300 },
                mst: { name: 'Mystical Space Typhoon', frame: 'spell' },
                sangan: { name: 'Sangan', frame: 'effect', atk: 1000 },
                celtic: { name: 'Celtic Guardian', frame: 'normal', atk: 1400 },
                alex: { name: 'Alexandrite Dragon', frame: 'normal', atk: 2000 }
            };
            var TURN_HAND = ['rota', 'mf', 'kuriboh', 'mst', 'sangan'];
            var TURN_DECK = 35;
            // One entry per caption in #wt-steps: the moves made in that step.
            var TURN_STEPS = [
                { phase: 'Your turn · Draw Phase', ops: [] },
                { phase: 'Your turn · Main Phase 1', ops: [{ card: 'rota', to: 's3' }] },
                { phase: 'Your turn · Main Phase 1', ops: [{ card: 'celtic', from: 'deck', to: 'hand' }] },
                { phase: 'Your turn · Main Phase 1', ops: [{ card: 'rota', to: 'gy' }] },
                { phase: 'Your turn · Main Phase 1', ops: [{ card: 'celtic', to: 'm3' }] },
                { phase: 'Your turn · Main Phase 1', ops: [{ card: 'mf', to: 's2', down: true }] },
                { phase: 'Your turn · End Phase', ops: [] },
                { phase: 'Opponent\'s turn · Main Phase 1', ops: [{ card: 'alex', from: 'opp', to: 'o-m3' }] },
                { phase: 'Opponent\'s turn · Battle Phase', ops: [], attack: ['alex', 'celtic'] },
                { phase: 'Opponent\'s turn · Battle Phase', ops: [{ card: 'mf', to: 's2', down: false }], attack: ['alex', 'celtic'] },
                { phase: 'Opponent\'s turn · Battle Phase', ops: [{ card: 'alex', to: 'o-gy' }] },
                { phase: 'Opponent\'s turn · Battle Phase', ops: [{ card: 'mf', to: 'gy' }] }
            ];

            function turnState(n) {
                var s = { at: {}, down: {}, order: {}, deck: TURN_DECK, moved: {}, from: {} };
                var seq = 0;
                TURN_HAND.forEach(function (c) { s.at[c] = 'hand'; s.order[c] = seq++; });
                for (var i = 0; i <= n; i++) {
                    TURN_STEPS[i].ops.forEach(function (op) {
                        if (op.from === 'deck') s.deck--;
                        s.at[op.card] = op.to;
                        s.down[op.card] = !!op.down;
                        s.order[op.card] = seq++;
                        if (i === n) {
                            s.moved[op.card] = true;
                            if (op.from) s.from[op.card] = op.from;
                        }
                    });
                }
                return s;
            }

            function initTurn() {
                var widget = document.getElementById('nb-turn');
                var list = document.getElementById('wt-steps');
                var board = document.getElementById('wt-board');
                if (!widget || !list || !board) return;
                var captions = $$('li', list);
                // If an approved edit changed the steps, keep the plain list instead.
                if (captions.length !== TURN_STEPS.length) return;
                var phaseEl = document.getElementById('wt-phase');
                var captionEl = document.getElementById('wt-caption');
                var dotsEl = document.getElementById('wt-dots');
                var prev = document.getElementById('wt-prev');
                var next = document.getElementById('wt-next');
                var zones = {};
                var step = 0;

                function zone(key, cls, label, rowStyle) {
                    var z = el('div', 'wt__zone ' + cls);
                    z.dataset.zone = key;
                    if (label) z.appendChild(el('span', 'wt__zone-label', label));
                    if (rowStyle) z.style.gridRow = rowStyle;
                    zones[key] = z;
                    board.appendChild(z);
                }
                function labelRow(left, right) {
                    var row = el('div', 'wt__label');
                    row.appendChild(el('span', null, left));
                    row.appendChild(el('span', null, right));
                    board.appendChild(row);
                    return row;
                }

                var oppLabel = labelRow('Opponent', 'LP 8000');
                for (var i = 1; i <= 5; i++) zone('o-m' + i, 'wt__zone--monster', '');
                zone('o-gy', 'wt__zone--pile', 'GY');
                board.appendChild(el('div', 'wt__divider'));
                for (i = 1; i <= 5; i++) zone('m' + i, 'wt__zone--monster', '');
                zone('gy', 'wt__zone--pile', 'GY');
                for (i = 1; i <= 5; i++) zone('s' + i, 'wt__zone--st', '');
                zone('deck', 'wt__zone--pile', 'Deck');
                var hand = el('div', 'wt__hand');
                hand.setAttribute('aria-label', 'Your hand');
                zones.hand = hand;
                board.appendChild(hand);
                labelRow('You', 'LP 8000');

                TURN_STEPS.forEach(function () { dotsEl.appendChild(el('span')); });

                function tile(id, down) {
                    var c = TURN_CARDS[id];
                    var t = el('span', 'wt-card wt-card--' + (down ? 'down' : c.frame));
                    t.dataset.card = id;
                    t.dataset.cardname = c.name;
                    t.setAttribute('role', 'button');
                    t.tabIndex = 0;
                    t.setAttribute('aria-label', c.name + (down ? ' (Set face-down)' : ''));
                    t.appendChild(el('span', 'wt-card__name', down ? 'Set' : c.name));
                    if (!down && c.atk !== undefined) t.appendChild(el('span', 'wt-card__stat', String(c.atk)));
                    return t;
                }

                function pileCount(z, n) {
                    var badge = $('.wt__count', z);
                    if (!n) {
                        if (badge) badge.remove();
                        return;
                    }
                    if (!badge) {
                        badge = el('span', 'wt__count');
                        z.appendChild(badge);
                    }
                    badge.textContent = n;
                }

                function render(animate) {
                    var before = {};
                    $$('.wt-card', board).forEach(function (t) { before[t.dataset.card] = t.getBoundingClientRect(); });
                    $$('.wt-card', board).forEach(function (t) { t.remove(); });

                    var s = turnState(step);
                    var ids = Object.keys(s.at).sort(function (a, b) { return s.order[a] - s.order[b]; });
                    var piles = { gy: [], 'o-gy': [] };
                    ids.forEach(function (id) {
                        var where = s.at[id];
                        if (piles[where]) piles[where].push(id);
                        else zones[where].appendChild(tile(id, s.down[id]));
                    });
                    // A GY shows its top card and how many cards are in it.
                    Object.keys(piles).forEach(function (key) {
                        var pile = piles[key];
                        if (pile.length) zones[key].appendChild(tile(pile[pile.length - 1], false));
                        pileCount(zones[key], pile.length);
                    });
                    var deckTile = el('span', 'wt-card wt-card--down');
                    deckTile.dataset.card = 'deck-pile';
                    deckTile.setAttribute('aria-hidden', 'true');
                    zones.deck.appendChild(deckTile);
                    pileCount(zones.deck, s.deck);

                    var attack = TURN_STEPS[step].attack;
                    $$('.wt-card', board).forEach(function (t) {
                        var id = t.dataset.card;
                        t.classList.toggle('is-moved', !!s.moved[id]);
                        if (attack) {
                            t.classList.toggle('is-attacking', id === attack[0]);
                            t.classList.toggle('is-target', id === attack[1]);
                        }
                        if (!animate || reduceMotion || typeof t.animate !== 'function' || id === 'deck-pile') return;
                        var now = t.getBoundingClientRect();
                        var was = before[id];
                        if (!was && s.from[id] === 'deck') was = zones.deck.getBoundingClientRect();
                        if (!was && s.from[id] === 'opp') was = oppLabel.getBoundingClientRect();
                        if (!was) return;
                        var dx = (was.left + was.width / 2) - (now.left + now.width / 2);
                        var dy = (was.top + was.height / 2) - (now.top + now.height / 2);
                        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
                        t.animate([
                            { transform: 'translate(' + dx + 'px, ' + dy + 'px)' },
                            { transform: 'none' }
                        ], { duration: 600, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)' });
                    });

                    phaseEl.textContent = 'Step ' + (step + 1) + ' of ' + TURN_STEPS.length + ' · ' + TURN_STEPS[step].phase;
                    captionEl.textContent = '';
                    var p = el('p');
                    [].slice.call(captions[step].childNodes).forEach(function (n) { p.appendChild(n.cloneNode(true)); });
                    captionEl.appendChild(p);
                    bindCardRefs(captionEl);
                    $$('span', dotsEl).forEach(function (d, k) {
                        d.classList.toggle('is-done', k < step);
                        d.classList.toggle('is-now', k === step);
                    });
                    prev.disabled = step === 0;
                    next.innerHTML = step === TURN_STEPS.length - 1
                        ? '<i class="fas fa-redo" aria-hidden="true"></i> Watch again'
                        : 'Next step <i class="fas fa-arrow-right" aria-hidden="true"></i>';
                }

                function go(n) {
                    step = (n + TURN_STEPS.length) % TURN_STEPS.length;
                    render(true);
                }
                prev.addEventListener('click', function () { go(step - 1); });
                next.addEventListener('click', function () { go(step + 1); });
                widget.addEventListener('keydown', function (event) {
                    if (event.target.closest('.wt-card')) return;
                    if (event.key === 'ArrowRight') go(step + 1);
                    if (event.key === 'ArrowLeft' && step > 0) go(step - 1);
                });
                board.addEventListener('click', function (event) {
                    var t = event.target.closest('.wt-card[data-cardname]');
                    if (t) openCardPopup(t, event);
                });
                board.addEventListener('keydown', function (event) {
                    var t = event.target.closest('.wt-card[data-cardname]');
                    if (t && (event.key === 'Enter' || event.key === ' ')) openCardPopup(t, event);
                });

                list.hidden = true;
                widget.hidden = false;
                render(false);
            }

            // ---------- Card nicknames: test yourself ----------

                function reveal(event) {
                    if (!root.classList.contains('is-testing')) return;
                    var li = event.target.closest('.nk-list li');
                    if (!li || li.classList.contains('is-revealed')) return;
                    if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
                    event.preventDefault();

            // ---------- Reading progress ----------
            function initProgress() {
                var card = document.getElementById('nb-progress');
                var sections = $$('section[data-readtime]');
                var order = sections.map(function (s) { return s.id; });
                var read = {};
                var saved = load(STORE_READ, []);
                if (Array.isArray(saved)) {
                    saved.forEach(function (id) { if (order.indexOf(id) !== -1) read[id] = true; });
                }
                var navLinks = {};
                $$('.nb-toc a[href^="#"]').forEach(function (a) { navLinks[a.getAttribute('href').slice(1)] = a; });
                var titles = {};
                sections.forEach(function (s) {
                    var h = $('h2', s);
                    titles[s.id] = h ? h.textContent.trim() : s.id;
                });

                function render() {
                    Object.keys(navLinks).forEach(function (id) { navLinks[id].classList.toggle('is-read', !!read[id]); });
                    if (!card) return;
                    var nRead = order.filter(function (id) { return read[id]; }).length;
                    var nWords = learnedCount();
                    var best = load(STORE_FRAME, 0) || 0;
                    card.hidden = !(nRead || nWords || best);
                    document.getElementById('pg-read').textContent = nRead;
                    document.getElementById('pg-read-total').textContent = order.length;
                    document.getElementById('pg-words').textContent = nWords;
                    document.getElementById('pg-frame-wrap').hidden = !best;
                    document.getElementById('pg-frame').textContent = best;
                    // Sections on the reader's path come first; folded ones after.
                    var unread = order.filter(function (id) { return !read[id] && !document.getElementById(id).classList.contains('is-folded'); })[0] ||
                        order.filter(function (id) { return !read[id]; })[0];
                    var cont = document.getElementById('pg-continue');
                    if (unread) {
                        cont.href = '#' + unread;
                        cont.textContent = 'Continue: ' + titles[unread];
                    } else {
                        cont.href = '#practice';
                        cont.textContent = "You've read it all. Keep practising";
                    }
                }

                // A section counts as read once its "Next" link has been on screen for
                // a moment, so scrolling straight past doesn't tick it off.
                var io = null;
                var timers = new Map();
                function watchUnread() {
                    if (!io) return;
                    sections.forEach(function (s) {
                        var end = $('.nb-next', s) || s.lastElementChild;
                        if (end && !read[s.id]) io.observe(end);
                    });
                }
                if ('IntersectionObserver' in window) {
                    io = new IntersectionObserver(function (entries) {
                        entries.forEach(function (entry) {
                            var section = entry.target.closest('section');
                            if (!section) return;
                            if (!entry.isIntersecting) {
                                clearTimeout(timers.get(entry.target));
                                return;
                            }
                            timers.set(entry.target, setTimeout(function () {
                                if (read[section.id]) return;
                                read[section.id] = true;
                                save(STORE_READ, Object.keys(read));
                                io.unobserve(entry.target);
                                render();
                            }, 1200));
                        });
                    }, { threshold: 1 });
                    watchUnread();
                }

                var clear = document.getElementById('pg-clear');
                var clearTimer = null;
                if (clear) {
                    clear.addEventListener('click', function () {
                        if (clear.dataset.armed !== 'true') {
                            clear.dataset.armed = 'true';
                            clear.textContent = 'Click again to clear everything';
                            clearTimer = setTimeout(function () {
                                clear.dataset.armed = '';
                                clear.textContent = 'Clear my progress';
                            }, 4000);
                            return;
                        }
                        clearTimeout(clearTimer);
                        clear.dataset.armed = '';
                        clear.textContent = 'Clear my progress';
                        read = {};
                        learned = {};
                        save(STORE_READ, []);
                        save(STORE_LEARNED, []);
                        save(STORE_FRAME, 0);
                        renderLearned();
                        if (practiceApi) practiceApi.restart();
                        watchUnread();
                        render();
                    });
                }

                learnedListeners.push(render);
                progressApi = { render: render };
                render();
            }

            function loadScript(src) {

            function initModernTurn() {
                var lab = document.getElementById('nb-modern-lab');

                    if (ready) return ready;
                    var css = document.createElement('link');
                    css.rel = 'stylesheet';
                    css.href = '../assets/css/Visualizer_Styles.css';
                    document.head.appendChild(css);
                    // combo-system.js declares ComboLoader as a top-level class, which is

                    ready = loadScript('../assets/js/combo-system.js')
                        .then(function () { return loadScript('../assets/js/combo-sounds.js').catch(function () { }); })
                        .then(function () {
                            if (typeof ComboLoader === 'undefined') throw new Error('no ComboLoader');
                            return ComboLoader.renderComboSystem('nb-modern-lab', MODERN_COMBO);
                        })
                        .catch(function () {
                            lab.innerHTML = '<p class="nb-modern__loading">The combo simulator didn\'t load. Reload the page to try again, or see the line on the <a href="Swordsoul%20Deck%20Analysis.html">Swordsoul page</a>.</p>';
                        });
                    return ready;
                }
                modernApi = { load: start };
                // A folded section has no size, so this also waits until it's opened.
                if (!('IntersectionObserver' in window)) {
                    start();
                    return;
                }
                var io = new IntersectionObserver(function (entries) {
                    if (entries.some(function (entry) { return entry.isIntersecting; })) {
                        io.disconnect();
                        start();
                    }
                }, { rootMargin: '700px 0px' });
                io.observe(lab);

                var score = d.s[0] === a.style ? 3 : d.s.indexOf(a.style) !== -1 ? 2 : 0;
                var gap = Math.abs(d.c - a.level);
                score += gap === 0 ? 2 : gap === 1 ? 1 : 0;
                if (a.look !== 'any' && d.t.indexOf(a.look) !== -1) score += 4;
                return score;
            }

            function initDeckFinder() {
                var root = document.getElementById('deck-finder');
                if (!root) return;
                var results = document.getElementById('df-results');
                var hint = document.getElementById('df-hint');
                var answers = {};
                var shown = false;

                function render() {
                    if (!answers.style || !answers.level || !answers.look) return;
                    var a = { style: answers.style, level: +answers.level, look: answers.look };
                    // "Surprise me" shuffles first, so ties come out differently each time.
                    var pool = a.look === 'any' ? shuffle(DECKS) : DECKS.slice();
                    var ranked = pool.map(function (d, i) { return { d: d, score: deckScore(d, a), i: i }; })
                        .sort(function (x, y) { return y.score - x.score || x.i - y.i; })
                        .slice(0, 3);
                    var art = {};
                    results.innerHTML = '';
                    results.appendChild(el('p', 'df__results-title', 'Decks to look at first'));
                    var list = el('ol', 'df__list');
                    ranked.forEach(function (r, i) {
                        var d = r.d;
                        var item = el('li', 'df-card');
                        var artId = 'df-art-' + i + '-img-container';
                        var pic = el('div', 'df-card__art');
                        pic.id = artId;
                        pic.appendChild(el('div', 'card-placeholder', d.card));
                        art[artId] = d.card;
                        var body = el('div', 'df-card__body');
                        var name = el('p', 'df-card__name');
                        var link = el('a', null, d.n);
                        link.href = deckPage(d);
                        name.appendChild(link);
                        body.appendChild(name);
                        body.appendChild(el('p', 'df-card__why', d.why));
                        var tags = el('ul', 'df-card__tags');
                        d.s.forEach(function (s) { tags.appendChild(el('li', s === a.style ? 'is-match' : null, DF_STYLE[s])); });
                        tags.appendChild(el('li', d.c === a.level ? 'is-match' : null, DF_LEVEL[d.c]));
                        d.t.forEach(function (t) { tags.appendChild(el('li', t === a.look ? 'is-match' : null, DF_LOOK[t])); });
                        tags.setAttribute('aria-label', 'Highlighted tags match your answers');
                        body.appendChild(tags);
                        var more = el('a', 'df-card__link', 'Read the ' + d.n + ' page ');
                        more.href = deckPage(d);
                        more.appendChild(el('i', 'fas fa-arrow-right')).setAttribute('aria-hidden', 'true');
                        body.appendChild(more);
                        item.appendChild(pic);
                        item.appendChild(body);
                        list.appendChild(item);
                    });
                    results.appendChild(list);
                    track('deck_finder', { style: a.style, level: a.level, look: a.look, top_deck: ranked[0].d.n });
                    // A live check of each result: name any of its cards that are Forbidden right now.
                    $$('.df-card', list).forEach(function (item, i) {
                        var d = ranked[i].d;
                        fetchGroupBans(d.q || d.n).then(function (hit) {
                            if (!hit.length || !item.isConnected) return;
                            var note = el('p', 'df-card__ban', hit.length === 1
                                ? 'Heads-up: ' + hit[0] + ' is Forbidden in the TCG right now.'
                                : 'Heads-up: ' + hit.length + ' of its cards are Forbidden in the TCG right now, including ' + hit[0] + '.');
                            var body = $('.df-card__body', item);
                            body.insertBefore(note, $('.df-card__link', body));
                        }).catch(function () { });
                    });
                    var again = el('p', 'df__hint df__again');
                    again.appendChild(document.createTextNode('Not quite right? Change any answer above, or '));
                    var all = el('a', null, 'browse every archetype');
                    all.href = '../index.html';
                    again.appendChild(all);
                    again.appendChild(document.createTextNode('.'));
                    results.appendChild(again);
                    results.hidden = false;
                    hint.hidden = true;
                    if (hasCardLoader()) CardLoader.loadCards(art);
                    if (!shown) {
                        shown = true;
                        var box = results.getBoundingClientRect();
                        if (box.bottom > window.innerHeight) results.scrollIntoView({ behavior: scrollBehavior, block: 'nearest' });
                    }
                }

                $$('.df__opt', root).forEach(function (opt) {
                    opt.addEventListener('click', function () {
                        var q = opt.dataset.q;
                        answers[q] = opt.dataset.v;
                        $$('.df__opt[data-q="' + q + '"]', root).forEach(function (o) {
                            o.setAttribute('aria-pressed', o === opt ? 'true' : 'false');
                        });
                        var left = ['style', 'level', 'look'].filter(function (k) { return !answers[k]; }).length;
                        if (left) hint.textContent = left === 1 ? 'One more answer to see your matches.' : 'Answer all three to see your matches.';
                        render();
                    });
                });
            }

            // ---------- Printable cheat sheet ----------
            var SHEET_PHASES = [
                ['Draw Phase', 'draw 1 card (the player going first skips this on turn 1).'],
                ['Standby Phase', 'a few card effects happen here; usually nothing does.'],
                ['Main Phase 1', 'Summon monsters, activate Spells, Set cards.'],
                ['Battle Phase', 'each of your monsters can attack once (not on the very first turn).'],
                ['Main Phase 2', 'another Main Phase, after combat.'],
                ['End Phase', '"end of turn" effects happen; discard down to 6 cards.']
            ];
            var SHEET_SUMMON = [
                'One Normal Summon (or Set) per turn. Level 1 to 4: free. Level 5 and 6: Tribute 1. Level 7 or higher: Tribute 2.',
                'Special Summons have no limit: they come from card effects and the Extra Deck.',
                'Fusion: usually a Fusion Spell sends the listed materials to the GY.',
                'Synchro: 1 Tuner plus non-Tuners whose Levels add up to the Synchro\'s Level.',
                'Xyz: stack monsters with the same Level; they become its materials.',
                'Link: send face-up monsters equal to its Link Rating. Link Monsters go to the Extra Monster Zone or a zone a Link points to.'
            ];
            var SHEET_BATTLE = [
                'Into Attack Position: the lower ATK is destroyed and its controller takes the difference. Equal: both are destroyed, no damage.',
                'Into Defense Position: ATK above DEF destroys it, no damage. ATK below DEF: you take the difference.',
                'Into an empty field: a direct attack for your monster\'s full ATK.'
            ];
            var SHEET_TABLE = [
                'Chains resolve last in, first out.',
                'Say what you activate, then ask "any responses?"',
                'You can always ask to read a card, or check either GY.',
                'Write Life Points down. Both players start at 8000.'
            ];

            function buildSheet(sheet) {
                if (sheet.dataset.built) return;
                sheet.dataset.built = 'true';
                function section(title, node) {
                    var s = el('section');
                    s.appendChild(el('h2', null, title));
                    s.appendChild(node);
                    return s;
                }
                function list(tag, items) {
                    var l = el(tag);
                    items.forEach(function (text) { l.appendChild(el('li', null, text)); });
                    return l;
                }
                sheet.appendChild(el('h1', null, 'Yu-Gi-Oh! cheat sheet'));
                sheet.appendChild(el('p', 'nb-sheet__sub', 'From the Archetype Nexus Beginner\'s Guide: archetypesnexus.com/pages/Beginners-Guide.html'));
                var cols = el('div', 'nb-sheet__cols');
                var phases = el('ol');
                SHEET_PHASES.forEach(function (p) {
                    var li = el('li');
                    li.appendChild(el('strong', null, p[0] + ': '));
                    li.appendChild(document.createTextNode(p[1]));
                    phases.appendChild(li);
                });
                cols.appendChild(section('A turn, in order', phases));
                cols.appendChild(section('Summoning', list('ul', SHEET_SUMMON)));
                cols.appendChild(section('Battle', list('ul', SHEET_BATTLE)));
                cols.appendChild(section('At the table', list('ul', SHEET_TABLE)));
                var words = el('dl');
                TERMS.filter(function (t) { return t.core; }).forEach(function (t) {
                    words.appendChild(el('dt', null, t.name));
                    words.appendChild(el('dd', null, t.short));
                });
                cols.appendChild(section('The ' + TERMS.filter(function (t) { return t.core; }).length + ' words to know first', words));
                sheet.appendChild(cols);
                sheet.appendChild(el('p', 'nb-sheet__foot', 'The full guide explains all ' + TERMS.length + ' words, with a field diagram, a card reader and a combo you can step through.'));
            }

            function initCheatSheet() {
                var sheet = document.getElementById('cheat-sheet');
                if (!sheet) return;
                var root = document.documentElement;
                document.addEventListener('click', function (event) {
                    var trigger = event.target.closest ? event.target.closest('[data-print-sheet]') : null;
                    if (!trigger) return;
                    event.preventDefault();
                    var from = trigger.closest('section[id]');
                    track('cheat_sheet_print', { from: from ? from.id : 'page' });
                    buildSheet(sheet);
                    root.classList.add('nb-printing-sheet');
                    window.print();
                });
                // Printing from the browser menu prints the whole guide as usual.
                window.addEventListener('afterprint', function () { root.classList.remove('nb-printing-sheet'); });
            }

            // ---------- Live banlist checks ----------
            // Statuses written on the page are checked against YGOProDeck's current lists,
            // cached for a day in this browser. The written text stays if the check fails.
            var BAN_API = 'https://db.ygoprodeck.com/api/v7/cardinfo.php';
            var STORE_BANS = 'nb-guide-bans';
            var BAN_TTL = 24 * 60 * 60 * 1000;
            var banMem = null;

            function banCache() {
                if (banMem) return banMem;
                var c = load(STORE_BANS, null);
                banMem = (c && c.t && Date.now() - c.t < BAN_TTL) ? c : { t: Date.now(), cards: {}, groups: {} };
                banMem.cards = banMem.cards || {};
                banMem.groups = banMem.groups || {};
                return banMem;
            }

            function banStatus(card, list) {
                return (card.banlist_info || {})['ban_' + list] || 'Unlimited';
            }

            function fetchJson(url) {
                return fetch(url).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); });
            }

            function fetchCardBans(names) {
                var cache = banCache();
                var missing = names.filter(function (n) { return !cache.cards[n]; });
                if (!missing.length) return Promise.resolve(cache.cards);
                return fetchJson(BAN_API + '?name=' + missing.map(encodeURIComponent).join('|')).then(function (j) {
                    (j.data || []).forEach(function (c) { cache.cards[c.name] = { tcg: banStatus(c, 'tcg'), ocg: banStatus(c, 'ocg') }; });
                    save(STORE_BANS, cache);
                    return cache.cards;
                });
            }

            // Every card whose name contains q (an archetype's name) that is Forbidden in the TCG.
            function fetchGroupBans(q) {
                var cache = banCache();
                if (cache.groups[q]) return Promise.resolve(cache.groups[q]);
                return fetchJson(BAN_API + '?fname=' + encodeURIComponent(q)).then(function (j) {
                    var hit = (j.data || []).filter(function (c) { return banStatus(c, 'tcg') === 'Forbidden'; }).map(function (c) { return c.name; });
                    cache.groups[q] = hit;
                    save(STORE_BANS, cache);
                    return hit;
                });
            }

            function initLiveBans() {
                var nodes = $$('[data-ban-card]');
                if (!nodes.length || !window.fetch) return;
                var names = [];
                nodes.forEach(function (n) { if (names.indexOf(n.dataset.banCard) === -1) names.push(n.dataset.banCard); });
                function apply(cards) {
                    var rows = 0, rowsLive = 0;
                    nodes.forEach(function (node) {
                        var live = cards[node.dataset.banCard];
                        if (node.tagName === 'TR') {
                            rows++;
                            if (!live) return;
                            rowsLive++;
                            $$('[data-ban-list]', node).forEach(function (td) { td.textContent = live[td.dataset.banList]; });
                            return;
                        }
                        if (!live || live.tcg === node.dataset.banExpect || node.dataset.banNoted) return;
                        // The sentence was true when written; say what changed next to it.
                        node.dataset.banNoted = 'true';
                        var text = 'Update: ' + node.dataset.banCard + ' is now ' + live.tcg + ' in the TCG.';
                        if (node.classList.contains('nb-ban')) {
                            var p = el('p', 'nb-ban__update', text);
                            p.setAttribute('data-pcs-skip', '');
                            node.appendChild(p);
                        } else {
                            var note = el('span', 'nb-ban-update', ' (' + text + ')');
                            note.setAttribute('data-pcs-skip', '');
                            node.insertAdjacentElement('afterend', note);
                        }
                    });
                    var asof = $('[data-ban-asof]');
                    if (asof && rows && rows === rowsLive) asof.textContent = 'right now';
                }
                function run() { fetchCardBans(names).then(apply).catch(function () { }); }
                // After the page has settled: one request a day per browser.
                if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 4000 });
                else setTimeout(run, 1500);
            }

            // ---------- Stop the combo: the reader plays the opponent ----------
            var STOP_COMBO = [
                {
                    step: 2,
                    q: 'Mo Ye\'s effect is activated to Special Summon a Swordsoul Token. Which of your cards stops it?',
                    options: ['Ash Blossom', 'Effect Veiler', 'Both of them', 'Neither'],
                    answer: 1,
                    why: 'Ash Blossom only stops effects that add a card from the Deck, Special Summon from the Deck or send a card from the Deck to the GY, and the Token doesn\'t come from the Deck. Effect Veiler negates a face-up monster\'s effects, so chained to Mo Ye it stops the Token (Infinite Impermanence would too). No Token means no Synchro Summon: this is the combo\'s choke point.'
                },
                {
                    step: 10,
                    q: 'Longyuan\'s effect is activated from the hand to Special Summon itself. Which of your cards stops it?',
                    options: ['Ash Blossom', 'Effect Veiler', 'Infinite Impermanence', 'None of them'],
                    answer: 3,
                    why: 'Ash Blossom needs the Deck, and Effect Veiler and Infinite Impermanence both target a face-up monster on the field. Longyuan uses its effect from the hand, out of their reach. Being hard to stop is what makes it a good extender.'
                },
                {
                    step: 17,
                    q: 'It\'s your turn now, and you activate a Spell Card. What can Qixing Longyuan do about it?',
                    options: ['Negate it', 'Banish it and deal you 1200 damage', 'Nothing, it only stops monsters'],
                    answer: 1,
                    why: 'It banishes the Spell and deals 1200 damage, but it doesn\'t negate it, so the Spell\'s effect still happens. Its other effect banishes a monster you Special Summon, and Chixiao can negate a monster\'s effects. Knowing exactly what each card on an end board does is how you find a way through it.'
                }
            ];

            function waitFor(test, ms) {
                return new Promise(function (resolve, reject) {
                    var waited = 0;
                    (function poll() {
                        if (test()) return resolve();
                        if ((waited += 150) > ms) return reject(new Error('timeout'));
                        setTimeout(poll, 150);
                    })();
                });
            }

            // Reset the simulator and step it to the moment a question is about.
            function showComboStep(n) {
                var lab = document.getElementById('nb-modern-lab');
                if (!lab) return;
                if (foldApi) foldApi.reveal(lab);
                if (modernApi) modernApi.load();
                scrollToNode(lab, 'start');
                waitFor(function () { return !!lab.querySelector('.btn-next'); }, 15000).then(function () {
                    lab.querySelector('.btn-reset').click();
                    for (var i = 0; i < n; i++) lab.querySelector('.btn-next').click();
                }).catch(function () { });
            }

            function initStopCombo() {
                var list = document.getElementById('sc-list');
                var score = document.getElementById('sc-score');
                if (!list) return;
                var first = {};
                STOP_COMBO.forEach(function (item, qi) {
                    var li = el('li', 'sc-q');
                    var text = el('p', 'sc-q__text');
                    text.appendChild(el('span', 'sc-q__num', String(qi + 1)));
                    text.appendChild(document.createTextNode(item.q));
                    li.appendChild(text);
                    var opts = el('div', 'sc-q__opts');
                    opts.setAttribute('role', 'group');
                    opts.setAttribute('aria-label', 'Answers to question ' + (qi + 1));
                    var why = el('p', 'sc-q__why');
                    why.hidden = true;
                    why.setAttribute('aria-live', 'polite');
                    item.options.forEach(function (label, oi) {
                        var b = button('sc-q__opt', label);
                        b.setAttribute('aria-pressed', 'false');
                        b.addEventListener('click', function () {
                            var right = oi === item.answer;
                            $$('.sc-q__opt', opts).forEach(function (o) {
                                o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
                                o.classList.remove('is-right', 'is-wrong');
                            });
                            b.classList.add(right ? 'is-right' : 'is-wrong');
                            why.textContent = '';
                            why.appendChild(el('strong', null, right ? 'Right. ' : 'Not quite. '));
                            why.appendChild(document.createTextNode(right ? item.why : 'Try another answer, or see it on the board.'));
                            why.hidden = false;
                            if (!(qi in first)) {
                                first[qi] = right;
                                track('stop_combo_answer', { question: qi + 1, correct: right });
                            }
                            if (right) why.classList.add('is-right'); else why.classList.remove('is-right');
                            var done = Object.keys(first).length;
                            if (done === STOP_COMBO.length) {
                                var got = Object.keys(first).filter(function (k) { return first[k]; }).length;
                                score.textContent = 'You got ' + got + ' of ' + STOP_COMBO.length + ' on your first try.' +
                                    (got === STOP_COMBO.length ? ' You found the choke point: you\'re ready to use handtraps.' : ' Read the explanations, then try the board again.');
                            }
                        });
                        opts.appendChild(b);
                    });
                    li.appendChild(opts);
                    li.appendChild(why);
                    var show = button('sc-q__show', 'Show me step ' + item.step + ' ');
                    show.appendChild(el('i', 'fas fa-arrow-up')).setAttribute('aria-hidden', 'true');
                    show.addEventListener('click', function () { showComboStep(item.step); });
                    li.appendChild(show);
                    list.appendChild(li);
                });
            }

            // ---------- Word hints on deck pages (assets/js/glossary-hints.js) ----------
            // The same browser setting the hints' own "Hide word hints" button writes.
            var STORE_HINTS = 'nexus-word-hints';
            function initWordHintsToggle() {
                var btn = document.getElementById('gl-word-hints');
                if (!btn) return;
                function render() {
                    var on = true;
                    try { on = localStorage.getItem(STORE_HINTS) !== 'off'; } catch (e) { }
                    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
                    btn.textContent = 'Word hints on deck pages: ' + (on ? 'on' : 'off');
                }
                btn.addEventListener('click', function () {
                    var on = btn.getAttribute('aria-pressed') !== 'true';
                    try {
                        if (on) localStorage.removeItem(STORE_HINTS);
                        else localStorage.setItem(STORE_HINTS, 'off');
                    } catch (e) { }
                    track('word_hints_' + (on ? 'on' : 'off'), { from: 'guide' });
                    render();
                });
                render();
            }

            // ---------- Start ----------
            function revealFromHash() {
                var id = decodeURIComponent(location.hash.slice(1));
                if (id.indexOf('term-') === 0) {
                    goToTerm(id, false);
                    return;
                }
                // A hash typed or pasted into a folded section: open it, then go there.
                var target = id ? document.getElementById(id) : null;
                if (target && foldApi && foldApi.reveal(target)) scrollToNode(target, 'start');
            }

            // ---------- Lore Archive: a short teaser on phones ----------
            function initLore() {
                var lore = $('.nb-lore');
                var more = lore ? $('.nb-lore__more', lore) : null;
                if (!more) return;
                var expanded = false;
                var label = more.firstChild;
                // Looked up each time: the suggestion system may replace the paragraph.
                function check() {
                    if (expanded) return;
                    var p = $('p', lore);
                    lore.classList.add('is-clamped');
                    var clipped = !!p && p.scrollHeight > p.clientHeight + 2;
                    lore.classList.toggle('is-clamped', clipped);
                    more.hidden = !clipped;
                }
                more.addEventListener('click', function () {
                    expanded = !expanded;
                    lore.classList.toggle('is-clamped', !expanded);
                    more.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                    label.textContent = expanded ? 'Show less' : 'Read more';
                    if (!expanded) check();
                });
                window.addEventListener('resize', check);
                check();
            }

            document.addEventListener('DOMContentLoaded', function () {
                indexTerms();
                initLearned();
                bindCardRefs(document);
                initPopovers();
                initToc();
                initField();
                initCalc();
                initChainStepper();
                initFrameGame();
                initReadCard();
                initTurn();
                initDecoder();
                initNicknames();
                initGlossary();
                initPractice();
                initCrossLinks();
                initProgress();
                renderLearned();
                initReadingTimes();
                // After the reading times, which count the full text of every section.
                initPicker();
                initLore();
                initModernTurn();
                initDeckFinder();
                initCheatSheet();
                initStopCombo();
                initLiveBans();
                initWordHintsToggle();
                loadWhenNear('cards', CARD_TYPE_ART);
                loadWhenNear('banlist', BANLIST_ART);

                window.addEventListener('popstate', revealFromHash);
                window.addEventListener('hashchange', revealFromHash);
                // A shared link: the browser scrolls to it before the page settles.
                // Folding, the lore teaser and the suggestion toolbars (added after a
                // network round trip) all move things afterwards, so land on it
                // again, unless the reader has started scrolling by then.
                var readerMoved = false;
                ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (type) {
                    window.addEventListener(type, function () { readerMoved = true; }, { once: true, passive: true });
                });
                function landOnHash(first) {
                    if (readerMoved || location.hash.length < 2) return;
                    var id = decodeURIComponent(location.hash.slice(1));
                    if (first && id.indexOf('term-') === 0) {
                        revealFromHash();
                        return;
                    }
                    var target = document.getElementById(id);
                    if (target) target.scrollIntoView({ block: 'start' });
                }
                setTimeout(function () { landOnHash(true); }, 150);

                var sectionsReady = typeof initPageSections === 'function' ? initPageSections('Beginners Guide') : null;
                if (sectionsReady && sectionsReady.then) {
                    sectionsReady.then(function () { setTimeout(function () { landOnHash(false); }, 50); }, function () { });
                }
            });
        })();
    </script>

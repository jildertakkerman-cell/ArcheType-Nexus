    <script>
        (function () {
            'use strict';

            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var scrollBehavior = reduceMotion ? 'auto' : 'smooth';
            var STORE_LEARNED = 'nb-guide-learned';
            var STORE_PATH = 'nb-guide-path';
            var STORE_READ = 'nb-guide-read';
            var STORE_FRAME = 'nb-guide-frame-best';
            var STORE_FOLD = 'nb-guide-fold';

            // Set by the widgets that other parts of the page can drive.
            var fieldApi = null;
            var practiceApi = null;
            var progressApi = null;
            var foldApi = null;
            var modernApi = null;

            // Analytics events. google-analytics.js runs Consent Mode, so the visitor's
            // cookie choice decides what is stored.
            function track(name, params) {
                try { if (typeof window.gtag === 'function') window.gtag('event', name, params || {}); } catch (e) { }
            }

            // ---------- Small helpers ----------
            function $(sel, root) { return (root || document).querySelector(sel); }
            function $$(sel, root) { return [].slice.call((root || document).querySelectorAll(sel)); }
            function el(tag, cls, text) {
                var node = document.createElement(tag);
                if (cls) node.className = cls;
                if (text !== undefined && text !== null) node.textContent = text;
                return node;
            }
            function button(cls, text) {
                var b = el('button', cls, text);
                b.type = 'button';
                return b;
            }
            function shuffle(list) {
                var a = list.slice();
                for (var i = a.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
                }
                return a;
            }
            function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
            function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
            // Smooth scrolling across half the page takes seconds, so long jumps are
            // instant. Returns true when it jumped.
            function scrollToNode(node, block) {
                // Anything the page jumps to opens first if its section is folded.
                if (foldApi) foldApi.reveal(node);
                var far = Math.abs(node.getBoundingClientRect().top) > window.innerHeight * 3;
                node.scrollIntoView({ behavior: far ? 'auto' : scrollBehavior, block: block || 'start' });
                return far || reduceMotion;
            }
            // Browser storage only holds conveniences (learned words, the start
            // picker); a private window or blocked storage just starts fresh.
            function load(key, fallback) {
                try {
                    var v = localStorage.getItem(key);
                    return v === null ? fallback : JSON.parse(v);
                } catch (e) { return fallback; }
            }
            function save(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { }
            }

            // Card art, loaded when its section gets close to the screen.
            var CARD_TYPE_ART = {
                'ct-normal-img-container': 'Blue-Eyes White Dragon',
                'ct-effect-img-container': 'Kuriboh',
                'ct-ritual-img-container': 'Black Luster Soldier',
                'ct-pendulum-img-container': 'Odd-Eyes Pendulum Dragon',
                'ct-spell-img-container': 'Dark Hole',
                'ct-trap-img-container': 'Mirror Force',
                'ct-fusion-img-container': 'Blue-Eyes Ultimate Dragon',
                'ct-synchro-img-container': 'Stardust Dragon',
                'ct-xyz-img-container': 'Number 39: Utopia',
                'ct-link-img-container': 'Decode Talker'
            };
            var BANLIST_ART = {
                'ban-forbidden-img-container': 'Pot of Greed',
                'ban-limited-img-container': "Harpie's Feather Duster",
                'ban-semi-img-container': 'Droll & Lock Bird',
                'ban-unlimited-img-container': 'Ash Blossom & Joyous Spring'
            };

            var CAT_LABELS = {
                basics: 'Game basics',
                effects: 'Effects & rulings',
                roles: 'Card roles',
                actions: 'Actions',
                strategy: 'Strategy',
                community: 'Community'
            };

            // ---------- The glossary is the one source of every word ----------
            var TERMS = [];
            var TERM_BY_ID = {};

            function indexTerms() {
                TERMS = $$('#glossary .term').map(function (node) {
                    var name = $('.term__name', node);
                    var short = $('.term__short', node);
                    return {
                        id: node.id.slice(5),
                        node: node,
                        name: name ? name.textContent.trim() : node.id,
                        short: short ? short.textContent.trim() : '',
                        cat: node.dataset.cat,
                        core: node.hasAttribute('data-core')
                    };
                });
                TERMS.forEach(function (t) { TERM_BY_ID[t.id] = t; });
            }

            // After an approved community edit a paragraph may lose its class, so
            // fall back to the entry's first paragraph.
            function termDefNode(t) {
                return t.node.querySelector('.term__def') || t.node.querySelector('.term__body p');
            }

            function catColor(t) {
                return getComputedStyle(t.node).getPropertyValue('--cat').trim();
            }

            // Wrong answers for a quiz: same category first, so the choice is a real one.
            function distractors(t, n) {
                var same = shuffle(TERMS.filter(function (o) { return o.id !== t.id && o.cat === t.cat; }));
                var other = shuffle(TERMS.filter(function (o) { return o.id !== t.id && o.cat !== t.cat; }));
                return same.concat(other).slice(0, n);
            }

            // ---------- Learned words ----------
            var learned = {};
            var learnedListeners = [];

            function initLearned() {
                var saved = load(STORE_LEARNED, []);
                if (Array.isArray(saved)) {
                    saved.forEach(function (id) { if (TERM_BY_ID[id]) learned[id] = true; });
                }
            }

            function learnedCount(list) {
                return (list || TERMS).filter(function (t) { return learned[t.id]; }).length;
            }

            function setLearned(id, on) {
                if (!TERM_BY_ID[id]) return;
                if (on) learned[id] = true;
                else delete learned[id];
                save(STORE_LEARNED, Object.keys(learned));
                renderLearned();
            }

            function renderLearned() {
                TERMS.forEach(function (t) {
                    var on = !!learned[t.id];
                    t.node.classList.toggle('is-learned', on);
                    var done = $('.term__done', t.node);
                    if (done) done.hidden = !on;
                    var box = $('.term__learn', t.node);
                    if (box) box.setAttribute('aria-checked', on ? 'true' : 'false');
                });
                learnedListeners.forEach(function (fn) { fn(); });
            }

            // ---------- Card popups ----------
            function hasCardLoader() {
                return typeof CardLoader !== 'undefined' && typeof CardLoader.loadCards === 'function';
            }

            function loadWhenNear(sectionId, art) {
                var section = document.getElementById(sectionId);
                if (!section || !hasCardLoader()) return;
                if (!('IntersectionObserver' in window)) {
                    CardLoader.loadCards(art);
                    return;
                }
                var io = new IntersectionObserver(function (entries) {
                    if (entries.some(function (entry) { return entry.isIntersecting; })) {
                        io.disconnect();
                        CardLoader.loadCards(art);
                    }
                }, { rootMargin: '600px 0px' });
                io.observe(section);
            }

            // Inline card names open the shared card popup (fetching the card first
            // when its art isn't on the page). Bound per element and stopped here,
            // because CardLoader closes the popup on any document click. They're
            // spans with role="button" so long names wrap inside the sentence.
            function openCardPopup(node, event) {
                if (!window.CardLoader || typeof CardLoader.showPopupByName !== 'function') return;
                event.preventDefault();
                event.stopPropagation();
                var source = event;
                // Keyboard activation has no pointer position; anchor the popup to the name instead.
                if (!event.clientX && !event.clientY) {
                    var rect = node.getBoundingClientRect();
                    source = {
                        clientX: rect.left + rect.width / 2,
                        clientY: rect.bottom,
                        target: node,
                        stopPropagation: function () { }
                    };
                }
                CardLoader.showPopupByName(node.dataset.cardname, source);
            }

            function bindCardRefs(root) {
                $$('.card-ref[data-cardname]', root).forEach(function (node) {
                    if (node.dataset.nbBound) return;
                    node.dataset.nbBound = 'true';
                    node.addEventListener('click', function (event) { openCardPopup(node, event); });
                    node.addEventListener('keydown', function (event) {
                        if (event.key === 'Enter' || event.key === ' ') openCardPopup(node, event);
                    });
                });
            }

            // ---------- On-page nav: current section and reading progress ----------
            function initToc() {
                var bar = document.getElementById('nb-read-progress');
                if (bar) {
                    var ticking = false;
                    var update = function () {
                        ticking = false;
                        var max = document.documentElement.scrollHeight - window.innerHeight;
                        var pct = max > 0 ? Math.min(100, Math.max(0, window.scrollY / max * 100)) : 0;
                        bar.style.width = pct + '%';
                    };
                    window.addEventListener('scroll', function () {
                        if (!ticking) {
                            ticking = true;
                            requestAnimationFrame(update);
                        }
                    }, { passive: true });
                    window.addEventListener('resize', update);
                    update();
                }

                // Mark the bar once it sticks, so the CSS can put a solid band behind it.
                var toc = $('.nb-toc');
                if (toc) {
                    var stickTop = 0;
                    var stuckTicking = false;
                    var checkStuck = function () {
                        stuckTicking = false;
                        toc.classList.toggle('is-stuck', window.scrollY > 0 && toc.getBoundingClientRect().top <= stickTop + 0.5);
                    };
                    var measureToc = function () {
                        stickTop = parseFloat(getComputedStyle(toc).top) || 0;
                        toc.style.setProperty('--nb-toc-h', toc.offsetHeight + 'px');
                        checkStuck();
                    };
                    window.addEventListener('scroll', function () {
                        if (!stuckTicking) {
                            stuckTicking = true;
                            requestAnimationFrame(checkStuck);
                        }
                    }, { passive: true });
                    window.addEventListener('resize', measureToc);
                    measureToc();
                }

                var links = $$('.nb-toc a[href^="#"]');
                if (!links.length || !('IntersectionObserver' in window)) return;
                var byId = {};
                links.forEach(function (link) { byId[link.getAttribute('href').slice(1)] = link; });
                var current = null;
                var io = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (!entry.isIntersecting) return;
                        var link = byId[entry.target.id];
                        if (!link || link === current) return;
                        if (current) current.removeAttribute('aria-current');
                        link.setAttribute('aria-current', 'true');
                        current = link;
                        var list = link.closest('.nb-toc__list');
                        if (list) list.scrollTo({ left: link.offsetLeft - 16, behavior: scrollBehavior });
                    });
                }, { rootMargin: '-35% 0px -60% 0px' });
                Object.keys(byId).forEach(function (id) {
                    var section = document.getElementById(id);
                    if (section) io.observe(section);
                });
            }

            function initReadingTimes() {
                $$('section[data-readtime]').forEach(function (section) {
                    var kicker = $('.nb-kicker', section);
                    if (!kicker) return;
                    var words = (section.innerText || section.textContent).split(/\s+/).filter(Boolean).length;
                    var minutes = Math.max(1, Math.round(words / 200));
                    kicker.appendChild(el('span', 'nb-readtime', '· ' + minutes + ' min read'));
                });
            }

            // ---------- Start picker ----------
            var PATH_SECTIONS = {
                'new': ['basics', 'field', 'cards', 'read-card', 'turn', 'decoder', 'practice'],
                'md': ['first-deck', 'where-to-play', 'banlist', 'glossary'],
                'back': ['field', 'cards', 'decoder', 'nicknames', 'glossary', 'banlist']
            };

            // Sections every reader keeps open: the start, the FAQ and the reference.
            var NEVER_FOLD = ['start', 'faq', 'glossary', 'resources'];

            function initPicker() {
                var root = document.getElementById('nb-picker');
                if (!root) return;
                var options = $$('.nb-picker__opt', root);
                var paths = $$('.nb-path', root);
                var tocLinks = $$('.nb-toc a[href^="#"]');
                var current = null;

                // Once a path is picked, the sections off it fold down to their
                // "In short" box. Opening one (its button, a link or a jump) keeps it
                // open for this visit.
                var foldOn = load(STORE_FOLD, true) !== false;
                var opened = {};
                var allNote = $('.nb-fold-all', root);
                var foldable = $$('section.nb-section[id]').filter(function (s) { return NEVER_FOLD.indexOf(s.id) === -1; });
                foldable.forEach(function (section) {
                    // Added before the suggestion system walks the page, and always
                    // present, so its wrapping is the same with or without a path.
                    var bar = el('div', 'nb-fold');
                    bar.hidden = true;
                    bar.setAttribute('data-pcs-skip', '');
                    bar.appendChild(el('span', 'nb-fold__note', "Not on your path, so it's folded to the summary."));
                    var open = button('nb-btn nb-fold__btn', 'Show the full section ');
                    open.appendChild(el('i', 'fas fa-chevron-down')).setAttribute('aria-hidden', 'true');
                    open.addEventListener('click', function () {
                        opened[section.id] = true;
                        applyFold();
                        var h = $('.nb-h2', section);
                        if (h) {
                            h.setAttribute('tabindex', '-1');
                            h.focus({ preventScroll: true });
                        }
                    });
                    bar.appendChild(open);
                    section.appendChild(bar);
                    section.nbFoldBar = bar;
                });

                function applyFold() {
                    var keep = PATH_SECTIONS[current];
                    foldable.forEach(function (s) {
                        var fold = !!keep && foldOn && keep.indexOf(s.id) === -1 && !opened[s.id];
                        s.classList.toggle('is-folded', fold);
                        s.nbFoldBar.hidden = !fold;
                    });
                    if (allNote) {
                        allNote.hidden = !keep;
                        $('.nb-fold-all__text', allNote).textContent = foldOn ? 'Sections off this path are folded to their summary.' : 'Every section is open.';
                        $('.nb-fold-all__btn', allNote).textContent = foldOn ? 'Show every section' : 'Fold the others again';
                    }
                    if (progressApi) progressApi.render();
                }

                if (allNote) {
                    $('.nb-fold-all__btn', allNote).addEventListener('click', function () {
                        foldOn = !foldOn;
                        opened = {};
                        save(STORE_FOLD, foldOn);
                        applyFold();
                    });
                }

                // Returns true when it had to open a section.
                function reveal(node) {
                    var section = node && node.closest ? node.closest('section.nb-section.is-folded') : null;
                    if (!section) return false;
                    opened[section.id] = true;
                    applyFold();
                    return true;
                }

                // Links open their target's section before the browser scrolls to it.
                document.addEventListener('click', function (event) {
                    var a = event.target.closest ? event.target.closest('a[href^="#"]') : null;
                    if (!a) return;
                    var id = decodeURIComponent(a.getAttribute('href').slice(1));
                    var target = id ? document.getElementById(id) : null;
                    if (target) reveal(target);
                }, true);

                // A shared link straight to a section opens it.
                var hashTarget = location.hash.length > 1 ? document.getElementById(decodeURIComponent(location.hash.slice(1))) : null;
                var hashSection = hashTarget && hashTarget.closest('section.nb-section[id]');
                if (hashSection) opened[hashSection.id] = true;

                foldApi = { reveal: reveal };

                function choose(key, remember) {
                    current = key;
                    options.forEach(function (o) { o.setAttribute('aria-pressed', o.dataset.path === key ? 'true' : 'false'); });
                    paths.forEach(function (p) { p.hidden = p.dataset.path !== key; });
                    var suggested = PATH_SECTIONS[key] || [];
                    tocLinks.forEach(function (a) {
                        a.classList.toggle('is-suggested', suggested.indexOf(a.getAttribute('href').slice(1)) !== -1);
                    });
                    applyFold();
                    if (remember) {
                        save(STORE_PATH, key || null);
                        track('guide_path', { path: key || 'none' });
                    }
                }

                options.forEach(function (o) {
                    o.addEventListener('click', function () {
                        var already = o.getAttribute('aria-pressed') === 'true';
                        choose(already ? null : o.dataset.path, true);
                    });
                });
                var saved = load(STORE_PATH, null);
                if (saved && PATH_SECTIONS[saved]) choose(saved, false);
            }

            // ---------- Definitions where the word is used ----------
            var pop = null;
            var popLink = null;
            var popTimer = null;

            function buildPopover() {
                pop = el('div', 'nb-pop');
                pop.hidden = true;
                pop.setAttribute('role', 'dialog');
                pop.setAttribute('aria-label', 'Word definition');
                pop.innerHTML =
                    '<button type="button" class="nb-pop__close" aria-label="Close"><i class="fas fa-times" aria-hidden="true"></i></button>' +
                    '<p class="nb-pop__cat"></p><p class="nb-pop__name"></p><p class="nb-pop__short"></p>' +
                    '<a class="nb-pop__more nb-jump" href="#glossary">Full entry in the glossary <i class="fas fa-arrow-down" aria-hidden="true"></i></a>';
                document.body.appendChild(pop);
                $('.nb-pop__close', pop).addEventListener('click', function () { closePopover(true); });
                pop.addEventListener('mouseenter', function () { clearTimeout(popTimer); });
                pop.addEventListener('mouseleave', function () { if (!pop.dataset.pinned) scheduleClose(); });
            }

            function positionPopover(link) {
                var sheet = window.innerWidth <= 640;
                pop.classList.toggle('is-sheet', sheet);
                if (sheet) {
                    pop.style.left = '';
                    pop.style.top = '';
                    return;
                }
                var r = link.getBoundingClientRect();
                var w = pop.offsetWidth;
                var h = pop.offsetHeight;
                var left = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), window.innerWidth - w - 12);
                var top = r.bottom + 8;
                if (top + h > window.innerHeight - 12 && r.top - h - 8 > 12) top = r.top - h - 8;
                pop.style.left = (left + window.scrollX) + 'px';
                pop.style.top = (top + window.scrollY) + 'px';
            }

            function openPopover(link, pinned) {
                var t = TERM_BY_ID[link.getAttribute('href').slice(6)];
                if (!t) return;
                clearTimeout(popTimer);
                popLink = link;
                pop.dataset.pinned = pinned ? 'true' : '';
                pop.style.setProperty('--cat', catColor(t));
                $('.nb-pop__cat', pop).textContent = CAT_LABELS[t.cat] || '';
                $('.nb-pop__name', pop).textContent = t.name;
                $('.nb-pop__short', pop).textContent = t.short;
                $('.nb-pop__more', pop).setAttribute('href', '#term-' + t.id);
                pop.hidden = false;
                positionPopover(link);
            }

            function closePopover(refocus) {
                if (!pop || pop.hidden) return;
                var link = popLink;
                pop.hidden = true;
                pop.dataset.pinned = '';
                popLink = null;
                if (refocus && link) link.focus();
            }

            function scheduleClose() {
                clearTimeout(popTimer);
                popTimer = setTimeout(function () { closePopover(false); }, 220);
            }

            function initPopovers() {
                buildPopover();

                document.addEventListener('click', function (event) {
                    var link = event.target.closest('a[href^="#term-"]');
                    if (!link) {
                        if (!pop.hidden && !pop.contains(event.target)) closePopover(false);
                        return;
                    }
                    var id = link.getAttribute('href').slice(1);
                    if (!document.getElementById(id)) return;
                    event.preventDefault();
                    // Inside the glossary (and from "full entry" links) a word link
                    // jumps to the entry; everywhere else it explains the word in place.
                    if (link.classList.contains('nb-jump') || link.closest('#glossary')) {
                        closePopover(false);
                        goToTerm(id, true);
                        return;
                    }
                    if (popLink === link && pop.dataset.pinned) {
                        closePopover(false);
                        return;
                    }
                    openPopover(link, true);
                });

                // Hover preview where there's a real pointer; a click pins it.
                if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                    document.addEventListener('mouseover', function (event) {
                        var link = event.target.closest && event.target.closest('main a[href^="#term-"]');
                        if (!link || link.closest('#glossary') || link.classList.contains('nb-jump')) return;
                        if (pop.dataset.pinned) return;
                        clearTimeout(popTimer);
                        popTimer = setTimeout(function () { openPopover(link, false); }, 250);
                    });
                    document.addEventListener('mouseout', function (event) {
                        var link = event.target.closest && event.target.closest('main a[href^="#term-"]');
                        if (!link || pop.dataset.pinned) return;
                        var to = event.relatedTarget;
                        if (to && (link.contains(to) || pop.contains(to))) return;
                        scheduleClose();
                    });
                }

                document.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape') closePopover(true);
                });
                window.addEventListener('resize', function () {
                    if (!pop.hidden && popLink) positionPopover(popLink);
                });
            }

            // ---------- Glossary ----------
            var glossary = null;

            function goToTerm(id, push) {
                var t = TERM_BY_ID[id.replace(/^term-/, '')];
                if (!t) return;
                if (glossary) glossary.ensureVisible(t);
                t.node.open = true;
                t.node.classList.remove('is-flash');
                void t.node.offsetWidth;
                t.node.classList.add('is-flash');
                scrollToNode(t.node, 'start');
                if (push && location.hash !== '#term-' + t.id) history.pushState(null, '', '#term-' + t.id);
            }

            function initGlossary() {
                var root = document.getElementById('glossary');
                if (!root) return;
                var input = document.getElementById('gl-search');
                var countEl = document.getElementById('gl-count');
                var emptyEl = document.getElementById('gl-empty');
                var more = document.getElementById('gl-more');
                var toggleAll = document.getElementById('gl-toggle-all');
                var unlearnedN = document.getElementById('gl-unlearned-n');
                var chips = $$('.gl-chip', root);
                var groups = $$('.gl-group', root);
                var filter = 'core';

                function norm(s) {
                    return (s || '').toLowerCase().replace(/[’']/g, '').replace(/\s+/g, ' ').trim();
                }

                function matches(t, q) {
                    var head = norm(t.name + ', ' + t.node.dataset.alias);
                    if (head.indexOf(q) !== -1) return true;
                    // Full text only for 3+ letters, so "a" doesn't match everything.
                    return q.length >= 3 && norm(t.node.textContent).indexOf(q) !== -1;
                }

                function inFilter(t) {
                    if (filter === 'all') return true;
                    if (filter === 'core') return t.core;
                    if (filter === 'unlearned') return !learned[t.id];
                    return t.cat === filter;
                }

                function syncToggleAll() {
                    var visible = TERMS.filter(function (t) { return !t.node.hidden; });
                    toggleAll.hidden = visible.length === 0;
                    toggleAll.textContent = visible.some(function (t) { return !t.node.open; }) ? 'Open all' : 'Close all';
                }

                function apply() {
                    var raw = input.value.trim();
                    var q = norm(raw);
                    var shown = 0;
                    // A search always looks through every word, whatever the filter.
                    TERMS.forEach(function (t) {
                        var visible = q ? matches(t, q) : inFilter(t);
                        t.node.hidden = !visible;
                        if (visible) shown++;
                    });
                    groups.forEach(function (group) {
                        var all = $$('.term', group).length;
                        var visible = $$('.term:not([hidden])', group).length;
                        group.hidden = !visible;
                        // "4 of 24" while a filter or search hides some of the group.
                        var count = $('.gl-group__count', group);
                        if (count) count.textContent = visible < all ? visible + ' of ' + all : String(all);
                    });
                    emptyEl.hidden = shown !== 0;
                    if (q) countEl.textContent = shown + (shown === 1 ? ' word matches' : ' words match') + ' "' + raw + '"';
                    else if (filter === 'all') countEl.textContent = 'Showing all ' + TERMS.length + ' words';
                    else if (filter === 'core') countEl.textContent = 'Showing the ' + shown + ' starred words to learn first';
                    else if (filter === 'unlearned') countEl.textContent = shown ? shown + " words you haven't marked as learned" : "You've marked every word as learned";
                    else countEl.textContent = 'Showing ' + shown + ' of ' + TERMS.length + ' words';
                    more.hidden = !!q || filter === 'all';
                    syncToggleAll();
                }

                function setFilter(value) {
                    filter = value;
                    chips.forEach(function (chip) {
                        chip.setAttribute('aria-pressed', chip.dataset.filter === value ? 'true' : 'false');
                    });
                }

                chips.forEach(function (chip) {
                    chip.addEventListener('click', function () {
                        input.value = '';
                        setFilter(chip.dataset.filter);
                        apply();
                    });
                });

                var timer = null;
                input.addEventListener('input', function () {
                    clearTimeout(timer);
                    timer = setTimeout(apply, 120);
                });
                input.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape' && input.value) {

            function initField() {
                var field = $('.nb-field');
                var label = document.getElementById('nb-zoneinfo-label');
                var title = document.getElementById('nb-zoneinfo-title');
                var text = document.getElementById('nb-zoneinfo-text');
                var extra = document.getElementById('nb-zoneinfo-extra');
                var verbsBox = document.getElementById('nb-verbs');
                if (!field || !title || !text) return;
                var zones = $$('.nb-zone', field);
                var verbButtons = verbsBox ? $$('[data-verb]', verbsBox) : [];
                var litTimer = null;

                function slot(name) { return field.querySelector('[data-slot="' + name + '"]'); }

                function clearLit() {
                    zones.forEach(function (z) { z.classList.remove('is-from', 'is-to'); });
                }

                field.addEventListener('click', function (event) {
                    var zone = event.target.closest('.nb-zone');
                    if (!zone) return;
                    var key = zone.dataset.zone;
                    clearLit();
                    verbButtons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
                    zones.forEach(function (z) {
                        z.setAttribute('aria-pressed', z === zone ? 'true' : 'false');
                        z.classList.toggle('is-group-lit', z !== zone && z.dataset.zone === key);
                    });
                    label.textContent = 'Zone';
                    title.textContent = ZONES[key][0];
                    text.textContent = ZONES[key][1];
                    extra.textContent = '';
                });

                if (!verbsBox) return;
                verbsBox.hidden = false;

                function fly(from, to, verb, delay) {
                    if (reduceMotion || typeof from.animate !== 'function') return;
                    var box = field.getBoundingClientRect();
                    var a = from.getBoundingClientRect();
                    var b = to.getBoundingClientRect();
                    var ref = slot('m1').getBoundingClientRect();
                    var w = ref.width * (verb.small ? 0.4 : 0.62);
                    var h = w * 86 / 59;
                    var x0 = a.left - box.left + a.width / 2 - w / 2;
                    var y0 = a.top - box.top + a.height / 2 - h / 2;
                    var x1 = b.left - box.left + b.width / 2 - w / 2;
                    var y1 = b.top - box.top + b.height / 2 - h / 2;
                    var card = el('div', 'nb-flycard ' + (verb.back ? 'nb-flycard--back' : 'nb-flycard--face'));
                    card.style.width = w + 'px';
                    field.appendChild(card);
                    var start = 'translate(' + x0 + 'px, ' + y0 + 'px)';
                    var end = 'translate(' + x1 + 'px, ' + y1 + 'px)';
                    var anim = card.animate([
                        { transform: start + ' scale(0.85)', opacity: 0 },
                        { transform: start + ' scale(1)', opacity: 1, offset: 0.15 },
                        { transform: end + ' scale(1)', opacity: 1, offset: 0.8 },
                        { transform: end + ' scale(0.9)', opacity: 0 }
                    ], { duration: 1400, delay: delay || 0, easing: 'ease-in-out', fill: 'both' });
                    anim.onfinish = function () { card.remove(); };
                }

                function play(key) {
                    var btn = verbsBox.querySelector('[data-verb="' + key + '"]');
                    var verb = VERBS[key];
                    if (!btn || !verb) return;
                    var t = TERM_BY_ID[verb.term];
                    var from = slot(verb.from);
                    var to = slot(verb.to);
                    if (!t || !from || !to) return;

                    verbButtons.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
                    zones.forEach(function (z) {
                        z.setAttribute('aria-pressed', 'false');
                        z.classList.remove('is-group-lit');
                    });
                    clearLit();
                    from.classList.add('is-from');
                    to.classList.add('is-to');
                    clearTimeout(litTimer);
                    litTimer = setTimeout(clearLit, 2600);

                    for (var i = 0; i < (verb.count || 1); i++) fly(from, to, verb, i * 220);

                    label.textContent = 'Action';
                    title.textContent = verb.label || btn.textContent.trim();
                    text.textContent = t.short + (verb.note ? ' ' + verb.note : '');
                    extra.textContent = '';
                    var route = el('span', 'nb-zoneinfo__route');
                    route.appendChild(document.createTextNode(SLOT_NAMES[verb.from] + ' '));
                    var arrow = el('i', 'fas fa-arrow-right');
                    arrow.setAttribute('aria-hidden', 'true');
                    route.appendChild(arrow);
                    route.appendChild(el('span', 'sr-only', 'to'));
                    route.appendChild(document.createTextNode(' ' + SLOT_NAMES[verb.to]));
                    extra.appendChild(route);
                    var more = el('a', 'nb-zoneinfo__more nb-jump', 'Full glossary entry: ' + t.name + ' ↓');
                    more.href = '#term-' + t.id;
                    extra.appendChild(more);
                }

                verbsBox.addEventListener('click', function (event) {
                    var btn = event.target.closest('[data-verb]');
                    if (btn) play(btn.dataset.verb);
                });
                fieldApi = { play: play };
            }

            // ---------- Battle calculator ----------
            var MONSTERS = [
                { name: 'Blue-Eyes White Dragon', atk: 3000, def: 2500 },
                { name: 'Dark Magician', atk: 2500, def: 2100 },
                { name: 'Number 39: Utopia', atk: 2500, def: 2000 },
                { name: 'Stardust Dragon', atk: 2500, def: 2000 },
                { name: 'Decode Talker', atk: 2300, def: null },
                { name: 'Mystic Tomato', atk: 1400, def: 1100, floater: true },

            function initCalc() {
                var box = document.getElementById('nb-calc');
                if (!box) return;
                var attSel = document.getElementById('calc-att');
                var attAtk = document.getElementById('calc-att-atk');
                var defSel = document.getElementById('calc-def');
                var defVal = document.getElementById('calc-def-val');
                var defLabel = document.getElementById('calc-def-label');
                var defRow = document.getElementById('calc-def-row');
                var posBtns = $$('[data-pos]', box);
                var out = document.getElementById('calc-result');
                var pos = 'atk';

                function option(value, text) {
                    var o = el('option', null, text);
                    o.value = value;
                    return o;
                }
                MONSTERS.forEach(function (m, i) {
                    attSel.appendChild(option(String(i), m.name + ' (' + m.atk + ' ATK)'));
                });
                attSel.appendChild(option('custom', 'Your own numbers'));
                defSel.appendChild(option('none', 'No monster: a direct attack'));
                MONSTERS.forEach(function (m, i) {
                    defSel.appendChild(option(String(i), m.name + ' (' + m.atk + ' ATK' + (m.def === null ? ', Link' : ' / ' + m.def + ' DEF') + ')'));
                });
                defSel.appendChild(option('custom', 'Your own numbers'));
                attSel.value = '0';
                defSel.value = '1';

                function preset(sel) {
                    return /^\d+$/.test(sel.value) ? MONSTERS[+sel.value] : null;
                }
                function num(input) {
                    var v = parseInt(input.value, 10);
                    if (isNaN(v) || v < 0) v = 0;
                    return Math.min(v, 99999);
                }

                function syncAttacker() {
                    var m = preset(attSel);
                    if (m) attAtk.value = m.atk;
                }
                function syncDefender() {
                    var m = preset(defSel);
                    var direct = defSel.value === 'none';
                    var isLink = !!m && m.def === null;
                    if (isLink && pos === 'def') pos = 'atk';
                    posBtns.forEach(function (b) {
                        b.setAttribute('aria-pressed', b.dataset.pos === pos ? 'true' : 'false');
                        b.disabled = direct || (isLink && b.dataset.pos === 'def');
                    });
                    defRow.hidden = direct;
                    defLabel.textContent = pos === 'atk' ? 'ATK' : 'DEF';
                    if (m) defVal.value = pos === 'atk' ? m.atk : m.def;
                }

                function render() {
                    var am = preset(attSel);
                    var dm = preset(defSel);
                    var aName = am ? am.name : 'your monster';
                    var dName = dm ? dm.name : 'their monster';
                    var a = num(attAtk);
                    var d = num(defVal);
                    var direct = defSel.value === 'none';
                    var attDies = false, defDies = false, youDmg = 0, oppDmg = 0, line;

                    if (direct) {
                        oppDmg = a;
                        line = cap(aName) + ' attacks directly: your opponent takes its full ' + a + ' ATK as damage.';
                    } else if (pos === 'atk') {
                        if (a > d) {
                            defDies = true;
                            oppDmg = a - d;
                            line = a + ' ATK beats ' + d + ' ATK. ' + cap(dName) + ' is destroyed and your opponent takes the ' + oppDmg + ' difference.';
                        } else if (a < d) {
                            attDies = true;
                            youDmg = d - a;
                            line = a + ' ATK loses to ' + d + ' ATK. ' + cap(aName) + ' is destroyed and you take the ' + youDmg + ' difference.';
                        } else if (a > 0) {
                            attDies = defDies = true;
                            line = 'Both have ' + a + ' ATK, so both monsters are destroyed and nobody takes damage.';
                        } else {
                            line = 'Both have 0 ATK. In that one case neither monster is destroyed, and nobody takes damage.';
                        }
                    } else if (a > d) {
                        defDies = true;
                        line = a + ' ATK beats ' + d + ' DEF. ' + cap(dName) + ' is destroyed, but nobody takes damage from attacking a Defense Position monster.';
                    } else if (a < d) {
                        youDmg = d - a;
                        line = a + ' ATK is lower than ' + d + ' DEF. Nothing is destroyed, and you take the ' + youDmg + ' difference.';
                    } else {
                        line = a + ' ATK equals ' + d + ' DEF, so nothing happens.';
                    }

                    out.textContent = '';
                    out.appendChild(el('p', null, line));
                    var chips = el('div', 'nb-calc__chips');
                    function chip(text, cls) { chips.appendChild(el('span', 'nb-calc__chip' + (cls ? ' ' + cls : ''), text)); }
                    chip(cap(aName) + (attDies ? ': destroyed' : ': survives'), attDies ? 'is-destroyed' : '');
                    if (!direct) chip(cap(dName) + (defDies ? ': destroyed' : ': survives'), defDies ? 'is-destroyed' : '');
                    if (youDmg) chip('Your LP: 8000 → ' + Math.max(0, 8000 - youDmg), 'is-damage');
                    if (oppDmg) chip("Opponent's LP: 8000 → " + Math.max(0, 8000 - oppDmg) + (oppDmg >= 8000 ? " (that's game!)" : ''), 'is-damage');
                    out.appendChild(chips);

                    var notes = [];
                    if ((defDies && dm && dm.floater) || (attDies && am && am.floater)) {
                        notes.push('Mystic Tomato is a floater: when it\'s destroyed by battle, its effect can Special Summon a DARK monster with 1500 or less ATK from the Deck.');
                    }
                    if (dm && dm.def === null) notes.push('Link Monsters have no DEF, so they\'re always in Attack Position.');
                    notes.push('Card effects can change any of this; the calculator shows the basic rule.');
                    out.appendChild(el('p', 'nb-calc__note', notes.join(' ')));
                }

                attSel.addEventListener('change', function () { syncAttacker(); render(); });
                defSel.addEventListener('change', function () { syncDefender(); render(); });
                attAtk.addEventListener('input', function () { if (preset(attSel)) attSel.value = 'custom'; render(); });
                defVal.addEventListener('input', function () { if (preset(defSel)) defSel.value = 'custom'; render(); });
                posBtns.forEach(function (b) {
                    b.addEventListener('click', function () {
                        pos = b.dataset.pos;
                        syncDefender();
                        render();
                    });
                });

                syncAttacker();
                syncDefender();
                render();
                box.hidden = false;
            }

            // ---------- Chain stepper ----------
            var CHAIN_STEPS = [
                { text: 'You Normal Summon Snake-Eye Ash, and its effect triggers. Nothing is on the chain yet.', state: ['waiting', 'waiting'] },
                { text: 'Chain Link 1: you activate Snake-Eye Ash\'s effect to add a card from your Deck to your hand. Before it resolves, your opponent gets a chance to respond.', state: ['on', 'waiting'] },
                { text: 'Chain Link 2: your opponent discards Ash Blossom & Joyous Spring in response. You don\'t respond to that, so the chain is complete.', state: ['on', 'on'] },
                { text: 'The chain resolves from the top down, so Chain Link 2 goes first: Ash Blossom negates the effect of Chain Link 1.', state: ['on', 'resolving'] },

            function initChainStepper() {
                var list = document.getElementById('nb-chain-list');
                var controls = document.getElementById('chain-controls');
                var stepBtn = document.getElementById('chain-step');
                var resetBtn = document.getElementById('chain-reset');
                var caption = document.getElementById('chain-caption');
                if (!list || !controls) return;
                var items = $$('li[data-link]', list);
                // If an approved edit replaced the list, keep the static version.
                if (items.length !== 2) return;
                var startLabel = stepBtn.innerHTML;
                var step = -1;

                function show() {
                    var s = CHAIN_STEPS[step];
                    list.classList.add('is-stepping');
                    items.forEach(function (li, i) {
                        li.classList.remove('is-waiting', 'is-resolving', 'is-done', 'is-negated');
                        if (s.state[i] !== 'on') li.classList.add('is-' + s.state[i]);
                    });
                    caption.hidden = false;
                    caption.textContent = 'Step ' + (step + 1) + ' of ' + CHAIN_STEPS.length + ': ' + s.text;
                    var last = step === CHAIN_STEPS.length - 1;
                    stepBtn.innerHTML = last ? '<i class="fas fa-check" aria-hidden="true"></i> Done' : 'Next step <i class="fas fa-arrow-right" aria-hidden="true"></i>';
                    stepBtn.disabled = last;
                    resetBtn.hidden = false;
                }

                stepBtn.addEventListener('click', function () {
                    step = Math.min(step + 1, CHAIN_STEPS.length - 1);
                    show();
                });
                resetBtn.addEventListener('click', function () {
                    step = -1;
                    list.classList.remove('is-stepping');
                    items.forEach(function (li) { li.classList.remove('is-waiting', 'is-resolving', 'is-done', 'is-negated'); });
                    caption.hidden = true;
                    stepBtn.innerHTML = startLabel;
                    stepBtn.disabled = false;
                    resetBtn.hidden = true;
                    stepBtn.focus();
                });
                controls.hidden = false;
            }

            function initFrameGame() {
                var box = document.getElementById('nb-frame-game');

                var stage = document.getElementById('nf-stage');
                var cardBox = document.getElementById('nf-card');
                var optsBox = document.getElementById('nf-opts');
                var feedback = document.getElementById('nf-feedback');
                var status = document.getElementById('nf-status');
                var next = document.getElementById('nf-next');
                // Without CardLoader there are no card images, so the game stays hidden.
                if (!box || !hasCardLoader() || typeof CardLoader.loadCard !== 'function') return;

                var rounds = [], round = 0, score = 0, answered = false;
                var optionButtons = FRAME_TYPES.map(function (type) {
                    var b = button('nb-btn nf__opt');
                    b.dataset.type = type.key;
                    var sw = el('span', 'nb-ct__swatch');
                    sw.style.background = type.swatch;
                    b.appendChild(sw);
                    b.appendChild(document.createTextNode(type.label));
                    optsBox.appendChild(b);
                    return b;
                });

                function newGame() {
                    rounds = shuffle(FRAME_TYPES).map(function (type) {
                        return { type: type, card: pick(FRAME_POOL[type.key]) };
                    });
                    round = 0;
                    score = 0;
                    showRound();

                function showRound() {
                    answered = false;
                    // A fresh container each round, so a slow image from the last
                    // round can't land on top of this one.
                    cardBox.textContent = '';
                    var holder = el('div');
                    holder.id = 'nf-round-' + round + '-img-container';
                    holder.appendChild(el('div', 'nf__back'));
                    cardBox.appendChild(holder);
                    CardLoader.loadCard(rounds[round].card, holder.id);
                    optionButtons.forEach(function (b) {
                        b.disabled = false;
                        b.classList.remove('is-right', 'is-wrong');
                    });
                    feedback.textContent = '';
                    status.textContent = 'Card ' + (round + 1) + ' of ' + rounds.length + ' · Score ' + score;

                    next.innerHTML = round === rounds.length - 1 ? 'See my score' : 'Next card <i class="fas fa-arrow-right" aria-hidden="true"></i>';

                    if (!b || answered) return;
                    answered = true;
                    var r = rounds[round];
                    var ok = b.dataset.type === r.type.key;
                    if (ok) score++;
                    optionButtons.forEach(function (o) {
                        o.disabled = true;
                        if (o.dataset.type === r.type.key) o.classList.add('is-right');
                    });
                    if (!ok) b.classList.add('is-wrong');
                    feedback.textContent = ok
                        ? 'Right! ' + r.card + ' is ' + r.type.name + ': ' + r.type.frame + '.'
                        : 'Not quite. ' + r.card + ' is ' + r.type.name + ', which has ' + r.type.frame + '.';
                    status.textContent = 'Card ' + (round + 1) + ' of ' + rounds.length + ' · Score ' + score;
                    next.disabled = false;
                });

                next.addEventListener('click', function () {
                    if (round < rounds.length - 1 && rounds.length) {
                        round++;
                        showRound();
                        return;
                    }
                    if (answered && round === rounds.length - 1 && next.dataset.finished !== 'true') {
                        next.dataset.finished = 'true';
                        if (score > (load(STORE_FRAME, 0) || 0)) save(STORE_FRAME, score);
                        if (progressApi) progressApi.render();
                        feedback.textContent = 'You named ' + score + ' of ' + rounds.length + ' frames.' + (score === rounds.length ? ' Perfect!' : ' Scroll up to compare the frames, then try again.');
                        next.innerHTML = '<i class="fas fa-redo" aria-hidden="true"></i> Play again';
                        return;
                    }
                    next.dataset.finished = '';
                    newGame();
                });

                start.hidden = false;
                start.addEventListener('click', function () {
                    start.hidden = true;
                    stage.hidden = false;
                    newGame();
                });
            }

            // ---------- Decoder: one sentence at a time, guess first ----------
            function initDecoder() {
                var list = document.getElementById('dc-list');
                if (!list) return;
                var sentences = $$('.dc-sentence', list);
                var bar = document.getElementById('dc-bar');
                var nav = document.getElementById('dc-nav');
                var countEl = document.getElementById('dc-count');
                var scoreEl = document.getElementById('dc-score');
                var guessBox = document.getElementById('dc-guess');
                var prev = document.getElementById('dc-prev');
                var next = document.getElementById('dc-next');
                var index = 0, right = 0, answered = 0;

                function show(i) {
                    index = (i + sentences.length) % sentences.length;
                    sentences.forEach(function (s, k) { s.classList.toggle('is-current', k === index); });
                    countEl.textContent = 'Sentence ' + (index + 1) + ' of ' + sentences.length;
                    prev.disabled = index === 0;
                    next.innerHTML = index === sentences.length - 1
                        ? '<i class="fas fa-redo" aria-hidden="true"></i> Back to the first'
                        : 'Next sentence <i class="fas fa-arrow-right" aria-hidden="true"></i>';
                }

                function renderScore() {
                    scoreEl.textContent = answered ? 'Guessed right: ' + right + ' of ' + answered : '';
                }

                function select(sentence, btn) {
                    $$('.dc-term', sentence).forEach(function (b) {
                        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
                    });
                }

                function renderQuestion(panel, btn) {
                    var t = TERM_BY_ID[btn.dataset.term];
                    panel.textContent = '';
                    panel.appendChild(el('p', 'dc-guess__q', 'What does "' + btn.textContent.trim() + '" mean here?'));
                    var wrap = el('div', 'dc-guess__opts');
                    shuffle([t].concat(distractors(t, 2))).forEach(function (o) {
                        var b = button('nb-btn dc-guess__opt', o.short);
                        b.dataset.answer = o.id === t.id ? 'yes' : '';
                        wrap.appendChild(b);
                    });
                    panel.appendChild(wrap);
                }

                function renderReveal(panel, btn, result) {
                    var t = TERM_BY_ID[btn.dataset.term];
                    panel.textContent = '';
                    if (result) {
                        panel.appendChild(el('p', 'dc-result is-' + result, result === 'right' ? 'Right!' : 'Not quite. Here\'s what it means:'));
                    }
                    panel.appendChild(el('p', 'dc-panel__word', '"' + btn.textContent.trim() + '"' + (t ? ' → ' + t.name : '')));
                    if (btn.dataset.note) {
                        var note = el('p', null, btn.dataset.note + ' ');
                        if (btn.dataset.card) {
                            var ref = el('span', 'card-ref', 'See the card');
                            ref.setAttribute('role', 'button');
                            ref.tabIndex = 0;
                            ref.dataset.cardname = btn.dataset.card;
                            note.appendChild(ref);
                        }
                        panel.appendChild(note);
                    }
                    var def = t && termDefNode(t);
                    if (def) {
                        var copy = def.cloneNode(true);
                        copy.removeAttribute('class');
                        panel.appendChild(copy);
                    }
                    if (t) {
                        var more = el('p', 'dc-panel__more');
                        var link = el('a', 'nb-jump', 'Full glossary entry ↓');
                        link.href = '#term-' + t.id;
                        more.appendChild(link);
                        panel.appendChild(more);
                    }
                    bindCardRefs(panel);
                }

                sentences.forEach(function (sentence) {
                    var panel = $('.dc-panel', sentence);
                    var current = null;
                    sentence.addEventListener('click', function (event) {
                        var opt = event.target.closest('.dc-guess__opt');
                        if (opt && current && !current.dataset.guessed) {
                            var ok = opt.dataset.answer === 'yes';
                            current.dataset.guessed = ok ? 'right' : 'wrong';
                            current.classList.add(ok ? 'is-right' : 'is-wrong');
                            answered++;
                            if (ok) right++;
                            renderScore();
                            renderReveal(panel, current, ok ? 'right' : 'wrong');
                            return;
                        }
                        var btn = event.target.closest('.dc-term');
                        if (!btn) return;
                        if (btn.getAttribute('aria-pressed') === 'true') {
                            select(sentence, null);
                            panel.hidden = true;
                            panel.textContent = '';
                            current = null;
                            return;
                        }
                        select(sentence, btn);
                        current = btn;
                        if (guessBox.checked && !btn.dataset.guessed && TERM_BY_ID[btn.dataset.term]) renderQuestion(panel, btn);
                        else renderReveal(panel, btn, null);
                        panel.hidden = false;
                    });
                });

                prev.addEventListener('click', function () { show(index - 1); });
                next.addEventListener('click', function () { show(index + 1); });

                list.classList.add('is-carousel');
                bar.hidden = false;
                nav.hidden = false;
                show(0);
                renderScore();
            }

                var tabs = $$('.pr__tab', root);
                var deckSel = document.getElementById('pr-deck');

                var ringText = document.getElementById('pr-ring-text');
                var flashPanel = document.getElementById('pr-flash');

                var RING = 2 * Math.PI * 18;
                ring.style.strokeDasharray = RING;

                function deckTerms() {
                    var v = deckSel.value;
                    if (v === 'all') return TERMS.slice();
                    if (v === 'unlearned') return TERMS.filter(function (t) { return !learned[t.id]; });
                    if (v.indexOf('cat:') === 0) return TERMS.filter(function (t) { return t.cat === v.slice(4); });
                    return TERMS.filter(function (t) { return t.core; });
                }

                function renderRing() {
                    var n = learnedCount();
                    ring.style.strokeDashoffset = RING * (1 - n / TERMS.length);

                    document.getElementById('pr-deck-unlearned').textContent = "Words I haven't learned (" + (TERMS.length - n) + ')';
                }

                function doneBox(target, title, text, actions) {
                    target.textContent = '';
                    target.appendChild(el('p', 'pr__done-title', title));
                    if (text) target.appendChild(el('p', null, text));
                    var row = el('div', 'fc__actions');
                    actions.forEach(function (a) {
                        var b = button('nb-btn' + (a.primary ? ' nb-btn--primary' : ''), a.label);
                        b.addEventListener('click', a.run);
                        row.appendChild(b);
                    });
                    target.appendChild(row);

                // Flashcards
                var fcLive = document.getElementById('fc-live');
                var fcDone = document.getElementById('fc-done');

                var fcFront = document.getElementById('fc-front');

                var fcProgress = document.getElementById('fc-progress');

                function setFlipped(on) {

                    fcFront.setAttribute('aria-hidden', on ? 'true' : 'false');
                    fcBack.setAttribute('aria-hidden', on ? 'false' : 'true');
                }

                function showCard() {
                    var t = queue[0];
                    setFlipped(false);
                    fcCard.style.setProperty('--cat', catColor(t));
                    document.getElementById('fc-cat').textContent = CAT_LABELS[t.cat] || '';
                    document.getElementById('fc-term').textContent = t.name;
                    document.getElementById('fc-term-back').textContent = t.name;
                    document.getElementById('fc-short').textContent = t.short;
                    var def = termDefNode(t);
                    document.getElementById('fc-def').textContent = def ? def.textContent.trim() : '';
                    fcProgress.textContent = known + ' of ' + total + ' known · ' + queue.length + ' to go';
                }

                function startFlash() {
                    queue = shuffle(deckTerms());
                    total = queue.length;
                    known = 0;
                    fcDone.hidden = true;
                    if (!queue.length) {
                        fcLive.hidden = true;
                        doneBox(fcDone, "You've learned every word in this set.", 'Pick another set of words, or reset your progress to start over.', []);
                        return;
                    }
                    fcLive.hidden = false;
                    showCard();
                }

                function nextCard() {
                    if (queue.length) {
                        showCard();
                        return;
                    }
                    fcLive.hidden = true;
                    doneBox(fcDone, 'Round done!', 'You went through all ' + total + ' words in this set.', [
                        { label: 'Go again', run: startFlash },
                        { label: 'Try the quiz', primary: true, run: function () { selectTab('quiz'); } }
                    ]);

                fcCard.addEventListener('click', function () { setFlipped(!flipped); });
                document.getElementById('fc-got').addEventListener('click', function () {

                    known++;
                    setLearned(t.id, true);
                    nextCard();
                });
                document.getElementById('fc-again').addEventListener('click', function () {
                    var t = queue.shift();
                    if (!t) return;
                    // Back in a few cards' time, not straight away.
                    queue.splice(Math.min(queue.length, 3), 0, t);
                    nextCard();

                // Quiz
                var qzLive = document.getElementById('qz-live');

                var questions = [], qi = 0, qRight = 0, missed = [], qAnswered = false;
                // "meaning": show a meaning, pick the word. "word": show a word, pick its meaning.
                var quizDir = 'meaning';
                var dirButtons = $$('[data-dir]', root);

                function showQuestion() {
                    var t = questions[qi];
                    var asWord = quizDir === 'word';
                    qAnswered = false;
                    document.getElementById('qz-progress').textContent = 'Question ' + (qi + 1) + ' of ' + questions.length + ' · ' + qRight + ' right';
                    document.getElementById('qz-prompt').textContent = asWord ? 'What does this word mean?' : 'Which word means…';
                    document.getElementById('qz-short').textContent = asWord ? t.name : t.short;
                    qzOpts.textContent = '';
                    shuffle([t].concat(distractors(t, 3))).forEach(function (o) {

                        b.dataset.id = o.id;
                        qzOpts.appendChild(b);

                    qzNext.hidden = true;

                dirButtons.forEach(function (b) {

                        dirButtons.forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
                        startQuiz();
                    });
                });

                function startQuiz() {
                    var deck = shuffle(deckTerms());
                    qzDone.hidden = true;
                    if (!deck.length) {
                        qzLive.hidden = true;
                        doneBox(qzDone, "You've learned every word in this set.", 'Pick another set of words to keep practising.', []);
                        return;
                    }
                    questions = deck.slice(0, 10);
                    qi = 0;
                    qRight = 0;
                    missed = [];
                    qzLive.hidden = false;
                    showQuestion();
                }

                qzOpts.addEventListener('click', function (event) {
                    var b = event.target.closest('.qz__opt');
                    if (!b || qAnswered) return;
                    qAnswered = true;
                    var t = questions[qi];
                    var ok = b.dataset.id === t.id;
                    $$('.qz__opt', qzOpts).forEach(function (o) {
                        o.disabled = true;
                        if (o.dataset.id === t.id) o.classList.add('is-right');
                    });
                    if (ok) {
                        qRight++;
                        setLearned(t.id, true);
                        qzFeedback.textContent = 'Right!';
                    } else {
                        b.classList.add('is-wrong');
                        missed.push(t);
                        qzFeedback.textContent = quizDir === 'word'
                            ? 'Not quite: "' + t.name + '" means: ' + t.short
                            : 'Not quite: that\'s "' + t.name + '".';

                    qzNext.innerHTML = qi === questions.length - 1 ? 'See my score' : 'Next question <i class="fas fa-arrow-right" aria-hidden="true"></i>';
                    qzNext.hidden = false;
                    qzNext.focus();

                qzNext.addEventListener('click', function () {

                        showQuestion();
                        return;

                    qzLive.hidden = true;
                    doneBox(qzDone, 'You got ' + qRight + ' of ' + questions.length + ' right.', missed.length ? 'Worth another look:' : 'Perfect round!', [

                practiceApi = {

    <style>
        :root {
            --nb-bg: #0b0c11;
            --nb-surface: #12141b;
            --nb-surface-2: #181b24;
            --nb-line: #252a36;
            --nb-line-strong: #343a4a;
            --nb-text: #e9e7e2;
            --nb-muted: #a9acb6;
            --nb-faint: #888d9e;
            --nb-gold: #f2b544;
            --nb-gold-rgb: 242, 181, 68;

            /* Glossary categories */
            --nb-basics: #7dd3fc;
            --nb-effects: #c4b5fd;
            --nb-roles: #fcd34d;
            --nb-actions: #6ee7b7;
            --nb-strategy: #fda4af;
            --nb-community: #fdba74;

            /* Card frame colours */
            --frame-normal: #d8b76a;
            --frame-effect: #d9803f;
            --frame-ritual: #5f8fd0;
            --frame-fusion: #9a6bbd;
            --frame-synchro: #e8e8ea;
            --frame-xyz: #2a2a2e;
            --frame-link: #2b5bb8;
            --frame-spell: #1d9e74;
            --frame-trap: #c0508a;

            /* Sticky nav height + breathing room, for anchor jumps */
            --nb-toc-offset: 5rem;
        }

        html {
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }

        body {
            margin: 0;
            padding: 1.25rem 1rem 6rem;
            font-family: 'Inter', sans-serif;
            line-height: 1.65;
            color: var(--nb-text);
            background:
                radial-gradient(ellipse 80% 40% at 50% -5%, rgba(var(--nb-gold-rgb), 0.08), transparent 70%),
                var(--nb-bg);
            min-height: 100vh;
        }

        @media (min-width: 768px) {
            body {
                padding: 2rem 1.5rem 6rem;
            }
        }

        a {
            color: var(--nb-gold);
            text-decoration: underline;
            text-decoration-color: rgba(var(--nb-gold-rgb), 0.4);
            text-underline-offset: 2px;
        }

        a:hover {
            text-decoration-color: var(--nb-gold);
        }

        a:focus-visible,
        button:focus-visible,
        .card-ref:focus-visible,
        input:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--nb-gold);
            outline-offset: 2px;
        }

        strong {
            color: #fff;
            font-weight: 700;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* page-sections.js color=accent token */
        .text-accent {
            color: var(--nb-gold);
        }

        .nb-shell {
            max-width: 72rem;
            margin: 0 auto;
        }

        /* ---------- Home button ---------- */
        .ygo-home-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--nb-gold);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--nb-gold);
            border-radius: 50%;
            text-decoration: none;
            font-size: 1.1rem;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .ygo-home-button:hover,
        .ygo-home-button:focus-visible {
            transform: scale(1.08);
            color: #000;
            background: var(--nb-gold);
        }

        /* ---------- Banner ---------- */
        .nb-banner {
            position: relative;
            min-height: clamp(230px, 32vw, 310px);
            display: grid;
            place-items: center;
            padding: 3rem 1.25rem;
            margin-bottom: 1.25rem;
            text-align: center;
            overflow: hidden;
            border: 1px solid var(--nb-line-strong);
            border-radius: 1.25rem;
            background:
                radial-gradient(ellipse 70% 60% at 50% 115%, rgba(var(--nb-gold-rgb), 0.28), transparent 70%),
                radial-gradient(ellipse 50% 50% at 10% 10%, rgba(125, 211, 252, 0.1), transparent 70%),
                linear-gradient(160deg, #1c1733 0%, #0e1019 65%);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.7);
        }

        /* Three card backs drifting behind the title */
        .nb-banner__card {
            position: absolute;
            width: clamp(56px, 9vw, 96px);
            aspect-ratio: 59 / 86;
            border-radius: 6px;
            border: 3px solid #6b4a24;
            background:
                radial-gradient(ellipse 34% 40% at 50% 50%, #2c1a0c 0 55%, #b8832e 57% 62%, transparent 64%),
                linear-gradient(145deg, #5a3a1a, #2b1a0b);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.55);
            opacity: 0.55;
            animation: nb-drift 9s ease-in-out infinite;
        }

        .nb-banner__card:nth-child(1) {
            left: 7%;
            top: 18%;
            transform: rotate(-14deg);
        }

        .nb-banner__card:nth-child(2) {
            right: 8%;
            top: 12%;
            transform: rotate(11deg);
            animation-delay: -3s;
        }

        .nb-banner__card:nth-child(3) {
            right: 20%;
            bottom: -18%;
            transform: rotate(-6deg);
            animation-delay: -6s;
            opacity: 0.35;
        }

        @keyframes nb-drift {
            50% {
                translate: 0 -10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .nb-banner__card {
                animation: none;
            }
        }

        @media (max-width: 640px) {
            .nb-banner__card:nth-child(3) {
                display: none;
            }
        }

        .nb-banner__content {
            position: relative;
            z-index: 1;
            max-width: 40rem;
        }

        .nb-title {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1.9rem, 5.5vw, 3.4rem);
            line-height: 1.1;
            letter-spacing: 0.01em;
            background: linear-gradient(180deg, #fff6dc 0%, var(--nb-gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 30px rgba(var(--nb-gold-rgb), 0.25);
        }

        .nb-tagline {
            margin: 0.9rem auto 0;
            max-width: 32rem;
            color: #d8d5cc;
            font-size: clamp(0.95rem, 2vw, 1.1rem);
        }

        /* ---------- On-page nav ---------- */
        .nb-toc {
            position: sticky;
            top: 0.75rem;
            z-index: 40;
            max-width: 60rem;
            /* Left offset keeps the bar clear of the fixed home button below 1280px. */
            margin: 0 auto 2.5rem 3.6rem;
        }

        @media (min-width: 1280px) {
            .nb-toc {
                margin-left: auto;
            }
        }

        .nb-toc__list {
            display: flex;
            gap: 0.2rem;
            margin: 0;
            padding: 0.3rem;
            list-style: none;
            overflow-x: auto;
            scrollbar-width: none;
            background: rgba(12, 13, 19, 0.92);
            border: 1px solid var(--nb-line-strong);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nb-toc__list::-webkit-scrollbar {
            display: none;
        }

        .nb-toc__list li {
            flex: 0 0 auto;
        }

        .nb-toc a {
            display: block;
            padding: 0.45rem 0.85rem;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            color: var(--nb-muted);
            text-decoration: none;
            border-radius: 999px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .nb-toc a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        .nb-toc a[aria-current="true"] {
            color: #1d1606;
            background: var(--nb-gold);
        }

        /* ---------- Sections ---------- */
        .nb-section {
            max-width: 64rem;
            margin: 0 auto 4.5rem;
            scroll-margin-top: var(--nb-toc-offset);
        }

        .nb-kicker {
            margin: 0 0 0.35rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--nb-gold);
        }

        .nb-h2 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.45rem, 3.4vw, 2rem);
            font-weight: 800;
            line-height: 1.2;
            color: #fff;
        }

        .nb-lead {
            margin: 0 0 1.75rem;
            max-width: 46rem;
            color: var(--nb-muted);
            font-size: 1.02rem;
        }

        .nb-h3 {
            margin: 0 0 0.5rem;
            font-size: 1.08rem;
            font-weight: 700;
            color: #fff;
        }

        .nb-panel {
            background: var(--nb-surface);
            border: 1px solid var(--nb-line);
            border-radius: 1rem;
            padding: 1.25rem 1.3rem;
        }

        .nb-panel p {
            margin: 0 0 0.75rem;
            color: #d6d4ce;
        }

        .nb-panel p:last-child,
        .nb-panel ul:last-child,
        .nb-panel ol:last-child {
            margin-bottom: 0;
        }

        .nb-list {
            margin: 0 0 0.75rem;
            padding-left: 1.2rem;
            list-style: disc;
            color: #d6d4ce;
        }

        .nb-list li {
            margin-bottom: 0.35rem;
        }

        .nb-list li::marker {
            color: var(--nb-gold);
        }

        .nb-grid-2 {
            display: grid;
            gap: 1rem;
        }

        @media (min-width: 760px) {
            .nb-grid-2 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .nb-span-all {
            grid-column: 1 / -1;
        }

        /* Inline card names that open the shared card popup */
        .card-ref {
            display: inline;
            padding: 0;
            margin: 0;
            border: 0;
            background: none;
            font: inherit;
            font-weight: 600;
            color: #f7d58c;
            text-decoration: underline dotted rgba(var(--nb-gold-rgb), 0.6);
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .card-ref:hover {
            color: #fff;
            text-decoration-style: solid;
        }

        .card-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            aspect-ratio: 59 / 86;
            width: 100%;
            padding: 0.5rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--nb-faint);
            background: var(--nb-surface-2);
            border: 1px dashed var(--nb-line-strong);
            border-radius: 0.4rem;
        }

        /* ---------- Lore Archive ---------- */
        .nb-lore {
            max-width: 52rem;
            margin: 0 auto 3.5rem;
            padding: 1.4rem 1.5rem;
            background: rgba(17, 17, 17, 0.8);
            border-left: 4px solid var(--nb-gold);
            border-radius: 0 0.9rem 0.9rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .nb-lore__head {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }

        .nb-lore__icon {
            flex: 0 0 auto;
            width: 2.4rem;
            height: 2.4rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            background: #b7862a;
        }

        .nb-lore__title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--nb-gold);
        }

        .nb-lore p {
            margin: 0;
            color: #d6d4ce;
        }

        /* ---------- Start here ---------- */
        .nb-steps {
            display: grid;
            gap: 1rem;
            counter-reset: nb-step;
        }

        @media (min-width: 640px) {
            .nb-steps {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1000px) {
            .nb-steps {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .nb-step {
            position: relative;
            padding: 1.2rem 1.2rem 1.1rem 1.2rem;
            background: var(--nb-surface);
            border: 1px solid var(--nb-line);
            border-radius: 1rem;
        }

        .nb-step__num {
            display: inline-grid;
            place-items: center;
            width: 2rem;
            height: 2rem;
            margin-bottom: 0.6rem;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.95rem;
            color: #1d1606;
            background: var(--nb-gold);
        }

        .nb-step p {
            margin: 0 0 0.6rem;
            color: #d6d4ce;
            font-size: 0.95rem;
        }

        .nb-step p:last-child {
            margin-bottom: 0;
        }

        .nb-step__links {
            font-size: 0.88rem;
        }

        /* ---------- Basics ---------- */
        .nb-phases {
            display: grid;
            gap: 0.5rem;
            margin: 0 0 0.75rem;
            padding: 0;
            list-style: none;
            counter-reset: nb-phase;
        }

        .nb-phases li {
            counter-increment: nb-phase;
            position: relative;
            padding: 0.55rem 0.75rem 0.55rem 2.6rem;
            background: var(--nb-surface-2);
            border: 1px solid var(--nb-line);
            border-radius: 0.6rem;
            font-size: 0.93rem;
            color: #d6d4ce;
        }

        .nb-phases li::before {
            content: counter(nb-phase);
            position: absolute;
            left: 0.7rem;
            top: 0.55rem;
            width: 1.35rem;
            height: 1.35rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 0.72rem;
            font-weight: 800;
            color: #1d1606;
            background: var(--nb-gold);
        }

        .nb-table-wrap {
            overflow-x: auto;
        }

        .nb-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        .nb-table th,
        .nb-table td {
            padding: 0.6rem 0.7rem;
            text-align: left;
            vertical-align: top;
            border-bottom: 1px solid var(--nb-line);
            color: #d6d4ce;
        }

        .nb-table th {
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--nb-faint);
        }

        .nb-table td:first-child {
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
        }

        @media (max-width: 560px) {
            .nb-table td:first-child {
                white-space: normal;
            }
        }

        /* Chain: a stack that resolves from the top */
        .nb-chain {
            display: flex;
            flex-direction: column-reverse;
            gap: 0.5rem;
            margin: 0 0 0.75rem;
            padding: 0;
            list-style: none;
        }

        .nb-chain li {
            padding: 0.7rem 0.85rem;
            border-radius: 0.6rem;
            background: var(--nb-surface-2);
            border: 1px solid var(--nb-line);
            font-size: 0.93rem;
            color: #d6d4ce;
        }

        .nb-chain li:last-child {
            border-color: rgba(var(--nb-gold-rgb), 0.55);
            margin-left: 0.9rem;
        }

        .nb-chain__tag {
            display: inline-block;
            margin-right: 0.45rem;
            padding: 0.05rem 0.45rem;
            border-radius: 0.35rem;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #1d1606;
            background: #c9c6be;
        }

        .nb-chain li:last-child .nb-chain__tag {
            background: var(--nb-gold);
        }

        /* ---------- Field diagram ---------- */
        .nb-field-wrap {
            display: grid;
            gap: 1rem;
            align-items: start;
        }

        @media (min-width: 900px) {
            .nb-field-wrap {
                grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
            }
        }

        .nb-field {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: clamp(0.25rem, 1vw, 0.5rem);
            padding: clamp(0.6rem, 2vw, 1rem);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent),
                #0f1219;
            border: 1px solid var(--nb-line-strong);
            border-radius: 1rem;
        }

        .nb-field__opp {
            grid-column: 1 / -1;
            padding: 0.35rem;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--nb-faint);
            border: 1px dashed var(--nb-line-strong);
            border-radius: 0.5rem;
        }

        .nb-zone {
            --zone: #8b93a7;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.1rem;
            min-width: 0;
            aspect-ratio: 5 / 6;
            padding: 0.2rem;
            font: inherit;
            font-size: clamp(0.55rem, 1.5vw, 0.75rem);
            font-weight: 700;
            line-height: 1.1;
            text-align: center;
            color: var(--zone);
            background: color-mix(in srgb, var(--zone) 10%, transparent);
            border: 1.5px solid color-mix(in srgb, var(--zone) 55%, transparent);
            border-radius: 0.45rem;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        .nb-zone i {
            font-size: 1.15em;
            opacity: 0.85;
        }

        .nb-zone:hover {
            background: color-mix(in srgb, var(--zone) 22%, transparent);
        }

        .nb-zone[aria-pressed="true"] {
            background: color-mix(in srgb, var(--zone) 30%, transparent);
            box-shadow: 0 0 0 2px var(--zone), 0 0 18px color-mix(in srgb, var(--zone) 45%, transparent);
        }

        .nb-zone.is-group-lit {
            background: color-mix(in srgb, var(--zone) 24%, transparent);
            border-color: var(--zone);
        }

        .nb-zone--wide {
            aspect-ratio: auto;
            min-height: 2.6rem;
        }

        .nb-zone--emz {
            --zone: #60a5fa;
        }

        .nb-zone--monster {
            --zone: #f59e5b;
        }

        .nb-zone--spelltrap {
            --zone: #34d399;
        }

        .nb-zone--pendulum {
            --zone: #2dd4bf;
        }

        .nb-zone--field {
            --zone: #a3e635;
        }

        .nb-zone--gy {
            --zone: #cbd5e1;
        }

        .nb-zone--deck {
            --zone: #d6a15c;
        }

        .nb-zone--extra {
            --zone: #c084fc;
        }

        .nb-zone--hand {
            --zone: var(--nb-gold);
        }

        .nb-zone--banished {
            --zone: #94a3b8;
            border-style: dashed;
        }

        .nb-zoneinfo {
            min-height: 12rem;
        }

        .nb-zoneinfo__label {
            margin: 0 0 0.25rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--nb-faint);
        }

        .nb-zoneinfo__title {
            margin: 0 0 0.5rem;
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
        }

        .nb-zoneinfo__text {
            margin: 0;
            color: #d6d4ce;
        }

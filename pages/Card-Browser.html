<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archetype Card Browser</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/card-loader.js"></script>
    <script src="../assets/js/card-browser.js"></script>

    <link href="../output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            /* Dark Slate 900 */
            color: #e2e8f0;
            /* Slate 200 */
        }

        .browser-header {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border-bottom: 1px solid #334155;
            padding: 2rem 1rem;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .browser-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .card-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        @media (min-width: 1280px) {
            .card-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        .card-item {
            transition: transform 0.2s;
        }

        .card-item:hover {
            transform: translateY(-4px);
            z-index: 10;
        }


        /* Type Headers */
        .type-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            }

            50% {
                box-shadow: 0 0 40px rgba(99, 102, 241, 0.5);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Enhanced Header */
        .browser-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            border-bottom: 1px solid #4f46e5;
            padding: 3rem 1rem;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .browser-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.2) 0%, transparent 60%);
            pointer-events: none;
        }

        .browser-header::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 8s infinite;
        }

        .gradient-title {
            background: linear-gradient(135deg, #818cf8 0%, #a78bfa 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Filter Section Enhancement */
        .filter-section {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.5) 0%, rgba(49, 46, 129, 0.3) 100%);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .filter-tag-btn:hover {
            transform: translateY(-1px);
        }

        .filter-tag-btn.active {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%) !important;
            color: white !important;
            border-color: transparent !important;
        }

        /* Card Count Badge */
        .count-badge {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            border: 1px solid rgba(99, 102, 241, 0.5);
        }

        /* --- Yu-Gi-Oh! Themed Home Button Styles --- */
        .ygo-home-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
            color: white;
            border: 2px solid #6366f1;
            border-radius: 12px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .ygo-home-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
        }
    </style>
</head>

<body>
    <a href="../index.html" class="ygo-home-button" title="Back to Nexus">
        <i class="fas fa-home"></i>
    </a>

    <!-- Back to Archetype Button (hidden by default, shown when coming from archetype page) -->
    <a id="back-to-archetype" href="#" class="ygo-back-button" title="Back to Archetype" style="display: none;">
        <i class="fas fa-arrow-left"></i>
        <span class="back-label">Back</span>
    </a>

    <style>
        .ygo-back-button {
            position: fixed;
            top: 20px;
            left: 80px;
            z-index: 1000;
            background: linear-gradient(135deg, #065f46 0%, #047857 50%, #065f46 100%);
            color: white;
            border: 2px solid #10b981;
            border-radius: 12px;
            height: 50px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .ygo-back-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .ygo-back-button .back-label {
            display: none;
        }

        @media (min-width: 640px) {
            .ygo-back-button .back-label {
                display: inline;
            }
        }
    </style>

    <script>
        // Show back button if came from an archetype page
        (function () {
            const referrer = document.referrer;
            const backBtn = document.getElementById('back-to-archetype');

            // Check if referrer is an archetype page (in pages/ folder, ends with .html, not Card-Browser)
            if (referrer && referrer.includes('/pages/') && referrer.endsWith('.html') && !referrer.includes('Card-Browser')) {
                backBtn.style.display = 'flex';
                backBtn.href = referrer;

                // Extract archetype name for tooltip
                const match = referrer.match(/pages\/(.+?)(?:\s+Deck|\s+Analysis|\.html)/i);
                if (match) {
                    backBtn.title = `Back to ${match[1].replace(/%20/g, ' ')}`;
                }
            }
        })();
    </script>

    <div class="browser-header">
        <h1 id="archetype-title" class="text-3xl md:text-5xl font-bold gradient-title mb-3 relative z-10">Loading...
        </h1>
        <p id="archetype-subtitle" class="text-slate-400 text-lg relative z-10">
            <i class="fas fa-layer-group mr-2 text-indigo-400"></i>
            Archetype Card Browser
        </p>
    </div>

    <div class="container mx-auto px-4 pb-16">
        <div id="browser-content">
            <div class="flex justify-center py-20">
                <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-indigo-500"></div>
            </div>
        </div>
    </div>

    <!-- Hidden popup container for card details -->
    <div id="card-popup"
        class="fixed z-50 bg-gray-900 border-2 border-indigo-500 text-white p-4 rounded-lg shadow-lg max-w-xs opacity-0 transition-opacity duration-200 pointer-events-none">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Auto-initialize browser logic if URL param exists
            const urlParams = new URLSearchParams(window.location.search);
            const archetype = urlParams.get('archetype');

            if (archetype) {
                // Wait for CardLoader to be ready
                if (window.CardLoader && window.CardLoader.initCardBrowserPage) {
                    CardLoader.initCardBrowserPage(archetype);
                } else {
                    // Poll if not ready (script loading order)
                    const checkInterval = setInterval(() => {
                        if (window.CardLoader && window.CardLoader.initCardBrowserPage) {
                            clearInterval(checkInterval);
                            CardLoader.initCardBrowserPage(archetype);
                        }
                    }, 100);
                }
            } else {
                document.getElementById('archetype-title').textContent = 'No Archetype Selected';
                document.getElementById('browser-content').innerHTML = `
                    <div class="text-center text-slate-500">
                        <p>Please select an archetype from an analysis page.</p>
                        <a href="../index.html" class="inline-block mt-4 text-indigo-400 hover:text-indigo-300">Return Home</a>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>

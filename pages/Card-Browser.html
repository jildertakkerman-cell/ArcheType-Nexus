<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archetype Card Browser | Archetype Nexus</title>
    <meta name="description" content="Browse every card in a Yu-Gi-Oh! archetype in one place: search card text, filter by role, and check TCG, OCG and Master Duel banlist status on Archetype Nexus.">
    <link rel="canonical" href="https://archetypesnexus.com/pages/Card-Browser.html">
    <!-- card-browser.js draws its own Follow button for the archetype in the URL -->
    <meta name="follow-archetype" content="manual">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="../output.css" rel="stylesheet">
    <!-- ?v= makes browsers fetch these again after a change; bump it when you edit them.
         Without it a cached old card-browser.js renders the old page inside this one. -->
    <link rel="stylesheet" href="../assets/css/card-browser.css?v=2026-10-07.1">
    <link rel="stylesheet" href="../assets/css/follow-archetype.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/card-loader.js?v=2026-10-06"></script>
    <script src="../assets/js/card-browser.js?v=2026-10-07.2"></script>
    <script src="../assets/js/follow-archetype.js?v=2026-10-06"></script>
</head>

<body class="cb-page">
    <a class="cb-skip" href="#cb-results">Skip to the cards</a>

    <header class="cb-topbar">
        <div class="cb-wrap cb-topbar-inner">
            <a class="cb-home" href="../index.html" aria-label="Archetype Nexus home">
                <svg class="cb-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 10.5 12 3l9 7.5"></path>
                    <path d="M5 9.5V21h14V9.5"></path>
                </svg>
            </a>
            <nav class="cb-crumbs" aria-label="Breadcrumb">
                <a href="../index.html">Archetype Nexus</a>
                <span class="cb-crumb-sep" aria-hidden="true">/</span>
                <span id="cb-crumb-archetype">Archetype</span>
                <span class="cb-crumb-sep" aria-hidden="true">/</span>
                <span aria-current="page">Cards</span>
            </nav>
            <!-- Phones show the archetype name here instead of the header below -->
            <p class="cb-topbar-title" id="cb-topbar-title" aria-hidden="true"></p>
            <div class="cb-top-actions">
                <a id="cb-guide-link" class="cb-btn" href="#" hidden>
                    <svg class="cb-icon cb-icon--wide" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"></path>
                        <path d="M6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5"></path>
                    </svg>
                    <svg class="cb-icon cb-icon--phone" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                    <span class="cb-btn-text">Deck guide</span><span class="cb-btn-text--short">Deck guide</span>
                </a>
                <button id="cb-follow" class="cb-btn" type="button" hidden>
                    <svg class="cb-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1L3.2 9.5l6.1-.9Z"></path>
                    </svg>
                    <span class="cb-btn-text">Follow</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="cb-wrap cb-hero">
            <div class="cb-hero-text">
                <p class="cb-eyebrow">Archetype card browser</p>
                <h1 id="archetype-title" class="cb-title">Loading…</h1>
                <p id="cb-summary" class="cb-summary"></p>
            </div>
            <div id="cb-legality" class="cb-legality" hidden></div>
        </section>

        <div id="browser-content">
            <div class="cb-wrap cb-message" role="status">Loading cards…</div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const archetype = new URLSearchParams(window.location.search).get('archetype');

            if (!archetype) {
                document.getElementById('archetype-title').textContent = 'No archetype selected';
                document.getElementById('cb-topbar-title').textContent = 'Card browser';
                document.getElementById('cb-crumb-archetype').textContent = 'Card browser';
                document.getElementById('browser-content').innerHTML = `
                    <div class="cb-wrap cb-message">
                        <p>Open the card browser from an archetype page to see its cards.</p>
                        <p><a href="../index.html">Browse all archetypes</a></p>
                    </div>`;
                return;
            }

            // card-loader.js and card-browser.js load in <head>, so both exist by now.
            if (window.CardLoader && window.CardLoader.initCardBrowserPage) {
                CardLoader.initCardBrowserPage(archetype);
            } else {
                document.getElementById('browser-content').innerHTML =
                    '<div class="cb-wrap cb-message">The card browser did not load. Try refreshing the page.</div>';
            }
        });
    </script>
</body>

</html>

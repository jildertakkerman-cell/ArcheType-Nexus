<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Archetype Nexus</title>

    <script src="../assets/js/google-analytics.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/text-utils.js"></script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="../assets/css/replay-analyzer.css">
    <link rel="stylesheet" href="../assets/css/cookie-consent.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color, #0a0a0a);
            color: var(--text-color, #f5f5f5);
            min-height: 100vh;
            padding: 4rem 1rem 3rem;
        }
        .admin-wrap {
            max-width: 1100px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .admin-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
        }
        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .tab-btn {
            padding: 0.45rem 1rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: #a3a3a3;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .tab-btn.active {
            background: rgba(245,158,11,0.15);
            border-color: rgba(245,158,11,0.4);
            color: #f59e0b;
        }
        /* ── Sidebar mode nav (matches the My Account page's Google-style layout) ── */
        .admin-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }
        .mode-bar {
            flex: 0 0 220px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            position: sticky;
            top: 1.5rem;
        }
        .mode-btn {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.45rem 1rem 0.45rem 0.5rem;
            border: none;
            background: none;
            border-radius: 999px;
            color: #e5e5e5;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            width: 100%;
            transition: background 0.15s;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.06); }
        .mode-btn.active {
            background: rgba(59, 88, 152, 0.35);
            color: #bfdbfe;
        }
        .mode-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 0.95rem;
            flex-shrink: 0;
            color: #0f172a;
        }
        .mode-icon-combos  { background: #c4b5fd; }
        .mode-icon-links   { background: #fcd34d; }
        .mode-icon-reasons { background: #86efac; }
        .admin-content-col { flex: 1; min-width: 0; }

        @media (max-width: 768px) {
            .admin-layout { flex-direction: column; gap: 1.25rem; }
            .mode-bar {
                position: static;
                flex: none;
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 0.25rem;
            }
            .mode-btn {
                flex-direction: column;
                gap: 0.3rem;
                padding: 0.4rem 0.6rem;
                border-radius: 0.75rem;
                font-size: 0.68rem;
                width: auto;
                flex: 0 0 auto;
            }
        }
        .combo-admin-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 0.875rem;
            padding: 1.1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .combo-admin-card-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .combo-admin-meta {
            flex: 1;
            min-width: 0;
        }
        .combo-admin-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #f5f5f5;
            margin-bottom: 0.2rem;
        }
        .combo-admin-sub {
            font-size: 0.78rem;
            color: #737373;
        }
        .combo-admin-sub span {
            color: #a3a3a3;
        }
        .meta-strip {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .mbadge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 0.4rem;
        }
        .mbadge-win  { background: rgba(34,197,94,0.15); color:#4ade80; border:1px solid rgba(34,197,94,0.3); }
        .mbadge-loss { background: rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
        .mbadge-tag  { background: rgba(255,255,255,0.06); color:#a3a3a3; border:1px solid rgba(255,255,255,0.1); }
        .mbadge-otk  { background: rgba(168,85,247,0.15); color:#c084fc; border:1px solid rgba(168,85,247,0.3); }
        .action-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-approve {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.35);
            color: #4ade80;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-reject {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-unapprove {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            color: #f59e0b;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .modnotes-input {
            flex: 1;
            min-width: 180px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0.5rem;
            color: #f5f5f5;
            font-size: 0.8rem;
            padding: 0.4rem 0.65rem;
            font-family: inherit;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #525252;
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
    </style>
</head>
<body>

<div class="admin-wrap">
    <div class="admin-header">
        <h1><i class="fas fa-shield-alt" style="color:#f59e0b;margin-right:0.6rem;"></i>Combo Guide Admin</h1>
        <a href="../index.html" style="color:#a3a3a3;font-size:0.82rem;text-decoration:none;">
            <i class="fas fa-arrow-left" style="margin-right:0.35rem;"></i>Back to site
        </a>
    </div>

    <div id="access-denied" style="display:none;text-align:center;padding:4rem 1rem;color:#f87171;">
        <i class="fas fa-lock" style="font-size:2.5rem;margin-bottom:1rem;display:block;"></i>
        <p style="font-size:1rem;">Access denied. Moderator role required.</p>
    </div>

    <div id="admin-content" style="display:none;">
      <div class="admin-layout">
        <div class="mode-bar">
            <button class="mode-btn active" onclick="switchMode('combos', this)">
                <span class="mode-icon mode-icon-combos"><i class="fas fa-scroll"></i></span>
                <span>Combos</span>
            </button>
            <button class="mode-btn" onclick="switchMode('links', this)">
                <span class="mode-icon mode-icon-links"><i class="fas fa-link"></i></span>
                <span>Synergy Links</span>
            </button>
            <button class="mode-btn" onclick="switchMode('reasons', this)">
                <span class="mode-icon mode-icon-reasons"><i class="fas fa-comment-dots"></i></span>
                <span>Synergy Reasons</span>
            </button>
        </div>

        <div class="admin-content-col">
        <div id="mode-combos">
            <div class="tab-bar">
                <button class="tab-btn active" data-group="combos" onclick="switchTab('combos', 'pending', this)">
                    <i class="fas fa-clock" style="margin-right:0.35rem;"></i>Pending
                    <span id="pending-count-combos" style="margin-left:0.35rem;opacity:0.6;"></span>
                </button>
                <button class="tab-btn" data-group="combos" onclick="switchTab('combos', 'approved', this)">
                    <i class="fas fa-check-circle" style="margin-right:0.35rem;"></i>Approved
                </button>
                <button class="tab-btn" data-group="combos" onclick="switchTab('combos', 'rejected', this)">
                    <i class="fas fa-times-circle" style="margin-right:0.35rem;"></i>Rejected
                </button>
            </div>
            <div id="tab-combos-pending"></div>
            <div id="tab-combos-approved" style="display:none;"></div>
            <div id="tab-combos-rejected" style="display:none;"></div>
        </div>

        <div id="mode-links" style="display:none;">
            <div class="tab-bar">
                <button class="tab-btn active" data-group="links" onclick="switchTab('links', 'pending', this)">
                    <i class="fas fa-clock" style="margin-right:0.35rem;"></i>Pending
                    <span id="pending-count-links" style="margin-left:0.35rem;opacity:0.6;"></span>
                </button>
                <button class="tab-btn" data-group="links" onclick="switchTab('links', 'approved', this)">
                    <i class="fas fa-check-circle" style="margin-right:0.35rem;"></i>Approved
                </button>
                <button class="tab-btn" data-group="links" onclick="switchTab('links', 'rejected', this)">
                    <i class="fas fa-times-circle" style="margin-right:0.35rem;"></i>Rejected
                </button>
            </div>
            <div id="tab-links-pending"></div>
            <div id="tab-links-approved" style="display:none;"></div>
            <div id="tab-links-rejected" style="display:none;"></div>
        </div>

        <div id="mode-reasons" style="display:none;">
            <div class="tab-bar">
                <button class="tab-btn active" data-group="reasons" onclick="switchTab('reasons', 'pending', this)">
                    <i class="fas fa-clock" style="margin-right:0.35rem;"></i>Pending
                    <span id="pending-count-reasons" style="margin-left:0.35rem;opacity:0.6;"></span>
                </button>
                <button class="tab-btn" data-group="reasons" onclick="switchTab('reasons', 'approved', this)">
                    <i class="fas fa-check-circle" style="margin-right:0.35rem;"></i>Approved
                </button>
                <button class="tab-btn" data-group="reasons" onclick="switchTab('reasons', 'rejected', this)">
                    <i class="fas fa-times-circle" style="margin-right:0.35rem;"></i>Rejected
                </button>
            </div>
            <div id="tab-reasons-pending"></div>
            <div id="tab-reasons-approved" style="display:none;"></div>
            <div id="tab-reasons-rejected" style="display:none;"></div>
        </div>
        </div><!-- /.admin-content-col -->
      </div><!-- /.admin-layout -->
    </div>
</div>

<script src="../assets/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Admin | Archetype Nexus</title>

    <script src="../assets/js/google-analytics.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/text-utils.js"></script>

    <!-- Section-rewrite rendering, for the moderation preview: page-sections.js's
         _pcsRenderBody/_pcsSectionStyle render a submission exactly as the live
         page would (bold/italic/color/size/bullets/combo-step layout), instead
         of showing raw markdown-lite source. card-loader.js resolves the real
         card art for combo-walkthrough previews. archetypes-data.js supplies the
         "View live page" link (filepath naming isn't consistent enough across
         pages — "Deck Analysis" vs "Archetype Breakdown" vs others — to
         reconstruct it any other way). None of these are wrapped in a module,
         so their top-level functions/consts are ordinary globals admin.js can
         call directly once loaded, no wiring needed beyond script order.
         admin.js must load last, after all of these. -->
    <script src="../assets/js/archetypes-data.js"></script>
    <script src="../assets/js/page-sections.js"></script>
    <script src="../assets/js/card-loader.js"></script>
    <link rel="stylesheet" href="../assets/css/Visualizer_Styles.css">
    <script src="../assets/js/combo-sounds.js"></script>
    <script src="../assets/js/combo-system.js"></script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Tailwind build + shared-archetype.css: the rendered preview below reuses
         the exact classes deck pages render with (text-green-400, list-disc,
         .card, .combo-step-card, .text-accent, ...), so both need to be loaded
         here too or the preview would show unstyled text. -->
    <link href="../output.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/shared-archetype.css">

    <link rel="stylesheet" href="../assets/css/replay-analyzer.css">
    <link rel="stylesheet" href="../assets/css/cookie-consent.css">

    <style>
        /* shared-archetype.css's .text-accent/.card/etc. all read this variable
           with a fallback — every deck page sets its OWN accent color this same
           way (inline, per page), so this just makes the admin page "a page
           with amber as its accent," matching everything else here already
           colored #f59e0b. There's no single "correct" per-archetype accent to
           use in a queue spanning every archetype at once, so a consistent
           admin-side color (with a note near the preview) beats guessing. */
        :root { --accent-color: #f59e0b; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color, #0a0a0a);
            color: var(--text-color, #f5f5f5);
            min-height: 100vh;
            padding: 4rem 1rem 3rem;
        }
        .admin-wrap {
            max-width: min(1980px, 98vw);
            margin: 0 auto;
            padding: 0 0.5rem;
        }
        #mode-combos, #mode-links, #mode-reasons, #mode-sections {
            max-width: 1100px;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .admin-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
        }
        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .tab-btn {
            padding: 0.45rem 1rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: #a3a3a3;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .tab-btn.active {
            background: rgba(245,158,11,0.15);
            border-color: rgba(245,158,11,0.4);
            color: #f59e0b;
        }
        /* ── Sidebar mode nav (matches the My Account page's Google-style layout) ── */
        .admin-layout {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }
        .mode-bar {
            flex: 0 0 200px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            position: sticky;
            top: 1.5rem;
            transition: all 0.2s ease;
        }
        .mode-bar.is-collapsed {
            flex: 0 0 56px;
        }
        .mode-bar.is-collapsed .mode-btn span:not(.mode-icon):not(.mode-count) {
            display: none;
        }
        .mode-bar.is-collapsed .mode-btn {
            padding: 0.5rem;
            justify-content: center;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            margin: 0 auto;
        }
        .mode-collapse-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.45rem;
            color: #a3a3a3;
            width: 34px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 0.4rem;
            align-self: flex-start;
            transition: all 0.15s ease;
        }
        .mode-collapse-btn:hover {
            background: rgba(255,255,255,0.09);
            color: #fff;
        }
        .mode-bar.is-collapsed .mode-collapse-btn {
            align-self: center;
        }
        .mode-btn {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.45rem 1rem 0.45rem 0.5rem;
            border: none;
            background: none;
            border-radius: 999px;
            color: #e5e5e5;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            width: 100%;
            transition: background 0.15s;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.06); }
        .mode-btn.active {
            background: rgba(59, 88, 152, 0.35);
            color: #bfdbfe;
        }
        .mode-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 0.95rem;
            flex-shrink: 0;
            color: #0f172a;
        }
        .mode-icon-combos      { background: #c4b5fd; }
        .mode-icon-links       { background: #fcd34d; }
        .mode-icon-reasons     { background: #86efac; }
        .mode-icon-sections    { background: #93c5fd; }
        .mode-icon-decks       { background: #fca5a5; }
        .mode-icon { position: relative; }
        /* Pending count (or decks needing attention) on the sidebar icon. */
        .mode-count {
            position: absolute; top: -4px; right: -6px;
            min-width: 18px; height: 18px; padding: 0 5px;
            border-radius: 999px; background: #f59e0b; color: #111;
            font-size: 0.66rem; font-weight: 800; line-height: 18px; text-align: center;
            box-shadow: 0 0 0 2px var(--bg-color, #0a0a0a);
        }
        .mode-count[hidden] { display: none; }
        .admin-content-col { flex: 1; min-width: 0; }

        @media (max-width: 768px) {
            .admin-layout { flex-direction: column; gap: 1.25rem; }
            .mode-bar {
                position: static;
                flex: none;
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 0.25rem;
            }
            .mode-btn {
                flex-direction: column;
                gap: 0.3rem;
                padding: 0.4rem 0.6rem;
                border-radius: 0.75rem;
                font-size: 0.68rem;
                width: auto;
                flex: 0 0 auto;
            }
        }
        .combo-admin-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 0.875rem;
            padding: 1.1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .combo-admin-card-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .combo-admin-meta {
            flex: 1;
            min-width: 0;
        }
        .combo-admin-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #f5f5f5;
            margin-bottom: 0.2rem;
        }
        .combo-admin-sub {
            font-size: 0.78rem;
            color: #737373;
        }
        .combo-admin-sub span {
            color: #a3a3a3;
        }
        .meta-strip {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .mbadge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 0.4rem;
        }
        .mbadge-win  { background: rgba(34,197,94,0.15); color:#4ade80; border:1px solid rgba(34,197,94,0.3); }
        .mbadge-loss { background: rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
        .mbadge-tag  { background: rgba(255,255,255,0.06); color:#a3a3a3; border:1px solid rgba(255,255,255,0.1); }
        .mbadge-otk  { background: rgba(168,85,247,0.15); color:#c084fc; border:1px solid rgba(168,85,247,0.3); }
        .action-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-approve {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.35);
            color: #4ade80;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-reject {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-unapprove {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            color: #f59e0b;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .modnotes-input {
            flex: 1;
            min-width: 180px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0.5rem;
            color: #f5f5f5;
            font-size: 0.8rem;
            padding: 0.4rem 0.65rem;
            font-family: inherit;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #525252;
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }

        /* ── Section Rewrites: rendered preview + before/after comparison ── */
        .pcs-admin-live-link {
            display: inline-flex; align-items: center; gap: 0.35rem;
            font-size: 0.72rem; font-weight: 600; color: #93c5fd; text-decoration: none;
            margin-left: 0.6rem; white-space: nowrap;
        }
        .pcs-admin-live-link:hover { text-decoration: underline; }
        .pcs-admin-compare {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
            margin: 0.5rem 0;
            /* Without this, grid's default stretch makes the shorter column's
               bordered box balloon to match the taller one (e.g. a one-line
               "no live version yet" note next to a multi-step combo preview)
               — each side should size to its own content instead. */
            align-items: start;
        }
        @media (max-width: 700px) {
            .pcs-admin-compare { grid-template-columns: 1fr; }
        }
        .pcs-admin-compare-label {
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
            color: #737373; margin-bottom: 0.35rem;
        }
        .pcs-admin-compare-label-new { color: #f59e0b; }
        .pcs-admin-compare-body, .pcs-admin-preview-single {
            background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.6rem; padding: 0.75rem 0.9rem; font-size: 0.85rem; line-height: 1.5;
            color: #d4d4d4;
        }
        .pcs-admin-compare-body p, .pcs-admin-preview-single p { margin: 0 0 0.5rem; }
        .pcs-admin-compare-body p:last-child, .pcs-admin-preview-single p:last-child { margin-bottom: 0; }
        .pcs-admin-empty { color: #525252; font-style: italic; font-size: 0.82rem; margin: 0; }

        /* ── Test Decks (report.json from scripts/check-decklists.js) ── */
        .mbadge-review { background: rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.3); }
        .deckrep-toolbar {
            display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
            margin-bottom: 1.25rem;
        }
        .deckrep-search { flex: 1 1 200px; }
        .deckrep-card { gap: 0.5rem; padding: 0.85rem 1.1rem; }
        .deckrep-msgs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
        .deckrep-msgs li { font-size: 0.8rem; line-height: 1.45; display: flex; gap: 0.5rem; align-items: baseline; }
        .deckrep-msgs li i { flex-shrink: 0; font-size: 0.75rem; }
        .deckrep-msg-error  { color: #fca5a5; }
        .deckrep-msg-review { color: #fcd34d; }
        .deckrep-msg-warn   { color: #a3a3a3; }
        .deckrep-notice {
            display: flex; gap: 0.75rem; align-items: flex-start;
            border-radius: 0.75rem; padding: 0.8rem 1rem; margin-bottom: 1rem;
            font-size: 0.82rem; line-height: 1.5; overflow-wrap: anywhere;
        }
        .deckrep-notice > i { margin-top: 0.2rem; }
        .deckrep-notice code { background: rgba(0,0,0,0.35); padding: 0.05rem 0.35rem; border-radius: 0.3rem; font-size: 0.78rem; }
        .deckrep-notice-warn  { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3); color: #fde68a; }
        .deckrep-notice-error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #fecaca; }
        .deckrep-missing { margin-top: 0.4rem; }
        .deckrep-reload {
            margin-left: 0.5rem; background: none; border: 1px solid rgba(255,255,255,0.15);
            color: #a3a3a3; font: inherit; font-size: 0.72rem; font-weight: 600;
            padding: 0.1rem 0.5rem; border-radius: 0.4rem; cursor: pointer;
        }
        .deckrep-reload:hover { color: #f5f5f5; border-color: rgba(255,255,255,0.3); }

        /* ── Moderation feedback: busy cards, inline errors, toast, paging ── */
        .combo-admin-card.is-busy { opacity: 0.55; pointer-events: none; }
        .card-error {
            font-size: 0.8rem; color: #fca5a5; background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.3); border-radius: 0.5rem; padding: 0.4rem 0.65rem;
        }
        .btn-more {
            display: block; width: 100%; margin-top: 0.25rem; padding: 0.55rem;
            background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15);
            border-radius: 0.6rem; color: #d4d4d4; font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
        }
        .btn-more:hover { background: rgba(255,255,255,0.06); }
        .btn-more span { color: #737373; font-weight: 400; }
        #admin-toast {
            position: fixed; left: 50%; bottom: 1.5rem; z-index: 1000;
            transform: translate(-50%, 1rem); opacity: 0; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            background: #1f2937; color: #f5f5f5; border: 1px solid rgba(34,197,94,0.4);
            border-radius: 0.6rem; padding: 0.6rem 1rem; font-size: 0.85rem; font-weight: 600;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5); max-width: calc(100vw - 2rem);
        }
        #admin-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
        #admin-toast.is-error { border-color: rgba(239,68,68,0.5); color: #fecaca; }
        /* Phones: notes field on its own line, so Approve and Reject stay side by side. */
        @media (max-width: 480px) {
            .action-row .modnotes-input { flex-basis: 100%; }
        }
        .deckrep-missing summary { cursor: pointer; font-weight: 600; }
        .deckrep-missing[open] summary { margin-bottom: 0.3rem; }

        /* ── Combo Audit (OCGCore Wasm Legality Verifier & Command Center) ── */
        .mode-icon-audit { color: #ec4899; }
        .audit-layout {
            display: grid;
            grid-template-columns: 310px minmax(760px, 1.45fr) minmax(380px, 1fr);
            gap: 1.25rem;
            align-items: start;
            margin-top: 1rem;
            transition: all 0.2s ease;
        }
        .audit-layout.queue-collapsed {
            grid-template-columns: 56px minmax(880px, 1.7fr) minmax(380px, 1fr);
        }
        .audit-layout.queue-collapsed .audit-sidebar-col {
            overflow: hidden;
            padding-right: 0;
        }
        .audit-layout.queue-collapsed .audit-card .audit-card-sub,
        .audit-layout.queue-collapsed .audit-card .audit-card-err,
        .audit-layout.queue-collapsed .audit-card .audit-badges,
        .audit-layout.queue-collapsed .audit-card .audit-card-title span:first-child {
            display: none;
        }
        .audit-layout.queue-collapsed .audit-card {
            padding: 0.5rem 0.2rem;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 1560px) {
            .audit-layout {
                grid-template-columns: 290px minmax(680px, 1.3fr) minmax(340px, 1fr);
                gap: 1rem;
            }
            .audit-layout.queue-collapsed {
                grid-template-columns: 56px minmax(780px, 1.5fr) minmax(340px, 1fr);
            }
        }
        @media (max-width: 1320px) {
            .audit-layout {
                grid-template-columns: 290px 1fr;
            }
            .audit-board-col, .audit-details-col {
                grid-column: 2;
            }
        }
        @media (max-width: 960px) {
            .audit-layout {
                grid-template-columns: 1fr;
            }
            .audit-board-col, .audit-details-col {
                grid-column: 1;
            }
        }
        .audit-sidebar-col {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        .audit-board-col {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-width: 0;
        }
        .audit-details-col {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.85rem;
            padding: 1.15rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            min-width: 0;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            padding-right: 0.35rem;
        }
        .audit-sim-hint {
            font-size: 0.75rem;
            color: #737373;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            margin-top: -0.25rem;
        }
        .kbd-hint {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.25rem;
            padding: 0.05rem 0.35rem;
            margin-left: 0.3rem;
            vertical-align: middle;
            font-family: monospace;
        }
        .audit-card {
            background: #171717; border: 1px solid rgba(255,255,255,0.08); border-radius: 0.65rem;
            padding: 0.75rem 0.9rem; cursor: pointer; transition: all 0.15s ease;
            position: relative; display: flex; flex-direction: column; gap: 0.35rem;
        }
        .audit-card:hover { border-color: rgba(255,255,255,0.22); background: #1c1c1c; }
        .audit-card.is-active {
            border-color: #ec4899; background: rgba(236,72,153,0.06);
            box-shadow: 0 0 15px rgba(236,72,153,0.15);
        }
        .audit-card-title {
            font-size: 0.88rem; font-weight: 700; color: #f5f5f5;
            display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem;
        }
        .audit-card-sub { font-size: 0.75rem; color: #a3a3a3; }
        .audit-card-err {
            font-size: 0.75rem; color: #fca5a5; line-height: 1.35;
            background: rgba(239,68,68,0.08); padding: 0.25rem 0.5rem; border-radius: 0.35rem;
            border-left: 3px solid #ef4444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .audit-badges { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; margin-top: 0.2rem; }
        .tag-pill {
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
            padding: 0.15rem 0.45rem; border-radius: 0.35rem;
        }
        .tag-pill-curated { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
        .tag-pill-html { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
        .tag-pill-illegal { background: rgba(239,68,68,0.18); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
        .tag-pill-fp { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
        .tag-pill-resolved { background: rgba(34,197,94,0.18); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
        .tag-pill-untriaged { background: rgba(255,255,255,0.06); color: #a3a3a3; border: 1px solid rgba(255,255,255,0.12); }

        /* Inspector Details Pane */
        .audit-inspector {
            background: #141414; border: 1px solid rgba(255,255,255,0.1); border-radius: 0.85rem;
            padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem;
        }
        .audit-insp-header {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            gap: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 1rem;
        }
        .audit-insp-title { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 0.6rem; }
        .audit-insp-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

        .btn-triage {
            font: inherit; font-size: 0.78rem; font-weight: 600; padding: 0.35rem 0.75rem;
            border-radius: 0.45rem; cursor: pointer; transition: all 0.15s ease;
            display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .btn-triage-illegal { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
        .btn-triage-illegal:hover, .btn-triage-illegal.is-selected { background: #ef4444; color: #fff; border-color: #ef4444; }
        .btn-triage-fp { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
        .btn-triage-fp:hover, .btn-triage-fp.is-selected { background: #f59e0b; color: #000; border-color: #f59e0b; }
        .btn-triage-resolved { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.35); }
        .btn-triage-resolved:hover, .btn-triage-resolved.is-selected { background: #22c55e; color: #000; border-color: #22c55e; }

        .audit-fail-box {
            background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.35);
            border-radius: 0.75rem; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.6rem;
        }
        .audit-fail-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; font-weight: 700; color: #f87171;
        }
        .audit-fail-steptext {
            font-size: 0.92rem; color: #f5f5f5; font-style: italic; background: rgba(0,0,0,0.3);
            padding: 0.6rem 0.8rem; border-radius: 0.45rem; border-left: 3px solid #ef4444;
        }
        .audit-fail-err { font-size: 0.84rem; color: #fca5a5; font-family: monospace; }

        /* Simulator Container in Admin */
        .audit-sim-wrap {
            background: #0a0a0a; border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem;
            padding: 0.85rem; overflow: hidden; position: relative;
        }
        .audit-sim-wrap .duel-board-wrapper { max-width: 100%; margin: 0 auto; margin-bottom: 0; }
        .audit-sim-wrap .duel-board {
            height: 620px;
            max-width: 100%;
            --card-w: 100px;
            --card-h: 145px;
        }
        .audit-sim-wrap .field-grid {
            grid-template-columns: 95px 1fr 95px;
            grid-template-rows: 105px 145px 145px;
            gap: 6px;
            padding: 10px;
        }
        .audit-sim-wrap .hand-area {
            height: 110px;
        }
        .audit-sim-wrap .card-token {
            width: var(--card-w, 100px);
            height: var(--card-h, 145px);
        }
        .audit-jump-btn {
            background: #dc2626; color: white; border: none; font: inherit; font-size: 0.78rem;
            font-weight: 700; padding: 0.35rem 0.75rem; border-radius: 0.45rem; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.35rem; transition: background 0.15s;
        }
        .audit-jump-btn:hover { background: #b91c1c; }

        /* Diagnostics Grid */
        .audit-diag-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
        }
        @media (max-width: 800px) {
            .audit-diag-grid { grid-template-columns: 1fr; }
        }
        .audit-diag-card {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.65rem; padding: 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.5rem;
        }
        .audit-diag-title {
            font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
            color: #a3a3a3; display: flex; align-items: center; gap: 0.4rem;
        }
        .audit-diag-list {
            list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.35rem;
            font-size: 0.8rem; max-height: 220px; overflow-y: auto;
        }
        .audit-diag-list li {
            padding: 0.3rem 0.5rem; background: rgba(255,255,255,0.03); border-radius: 0.3rem;
            line-height: 1.4; border-left: 2px solid rgba(255,255,255,0.15);
        }
        .audit-diag-list li.is-step-action { border-left-color: #22c55e; }
        .audit-diag-list li.is-trigger { border-left-color: #3b82f6; }
        .audit-diag-list li.is-select { border-left-color: #f59e0b; }
        .audit-offered-grid {
            display: flex; flex-wrap: wrap; gap: 0.4rem;
        }
        .audit-offered-chip {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.4rem; padding: 0.25rem 0.55rem; font-size: 0.76rem;
            display: inline-flex; align-items: center; gap: 0.35rem;
        }

        /* Step Timeline in Audit Inspector */
        .audit-steps-section {
            display: flex; flex-direction: column; gap: 0.6rem;
        }
        .audit-steps-header {
            font-size: 0.82rem; font-weight: 700; color: #a3a3a3; text-transform: uppercase; letter-spacing: 0.04em;
            display: flex; justify-content: space-between; align-items: center;
        }
        .audit-steps-list {
            display: flex; flex-direction: column; gap: 0.4rem; max-height: 280px; overflow-y: auto; padding-right: 0.35rem;
        }
        .audit-step-item {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.45rem;
            padding: 0.5rem 0.75rem; font-size: 0.82rem; cursor: pointer; transition: all 0.15s ease;
            display: flex; flex-direction: column; gap: 0.25rem;
        }
        .audit-step-item:hover {
            background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2);
        }
        .audit-step-item.is-failed-step {
            background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.5);
            box-shadow: 0 0 10px rgba(239,68,68,0.15);
        }
        .audit-step-item-header {
            display: flex; align-items: center; gap: 0.5rem;
        }
        .audit-step-badge {
            font-size: 0.7rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 0.3rem;
            background: rgba(255,255,255,0.1); color: #d4d4d4; flex-shrink: 0;
        }
        .audit-step-badge.is-fail {
            background: #ef4444; color: #ffffff;
        }
        .audit-step-err-detail {
            font-size: 0.76rem; color: #fca5a5; font-family: monospace; background: rgba(0,0,0,0.3);
            padding: 0.25rem 0.5rem; border-radius: 0.3rem; margin-top: 0.2rem;
        }
    </style>
    <link rel="stylesheet" href="../assets/css/follow-archetype.css">
    <script src="../assets/js/follow-archetype.js"></script>
</head>
<body data-page="admin">

<div class="admin-wrap">
    <div class="admin-header">
        <h1><i class="fas fa-shield-alt" style="color:#f59e0b;margin-right:0.6rem;"></i>Moderation</h1>
        <a href="../index.html" style="color:#a3a3a3;font-size:0.82rem;text-decoration:none;">
            <i class="fas fa-arrow-left" style="margin-right:0.35rem;"></i>Back to site
        </a>
    </div>

    <div id="access-denied" style="display:none;text-align:center;padding:4rem 1rem;color:#f87171;">
        <i class="fas fa-lock" style="font-size:2.5rem;margin-bottom:1rem;display:block;"></i>
        <p style="font-size:1rem;">Access denied. Moderator role required.</p>
    </div>

    <div id="admin-content" style="display:none;">
      <div class="admin-layout">
        <div class="mode-bar" id="admin-mode-bar">
            <button class="mode-collapse-btn" onclick="toggleModeBar()" title="Collapse / Expand sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <button class="mode-btn active" data-mode="combos" aria-pressed="true" onclick="switchMode('combos', this)">
                <span class="mode-icon mode-icon-combos"><i class="fas fa-scroll"></i><span class="mode-count" id="mode-count-combos" hidden></span></span>
                <span>Combos</span>
            </button>
            <button class="mode-btn" data-mode="links" aria-pressed="false" onclick="switchMode('links', this)">
                <span class="mode-icon mode-icon-links"><i class="fas fa-link"></i><span class="mode-count" id="mode-count-links" hidden></span></span>
                <span>Synergy Links</span>
            </button>
            <button class="mode-btn" data-mode="reasons" aria-pressed="false" onclick="switchMode('reasons', this)">
                <span class="mode-icon mode-icon-reasons"><i class="fas fa-comment-dots"></i><span class="mode-count" id="mode-count-reasons" hidden></span></span>
                <span>Synergy Reasons</span>
            </button>
            <button class="mode-btn" data-mode="sections" aria-pressed="false" onclick="switchMode('sections', this)">
                <span class="mode-icon mode-icon-sections"><i class="fas fa-pen"></i><span class="mode-count" id="mode-count-sections" hidden></span></span>
                <span>Section Rewrites</span>
            </button>
            <button class="mode-btn" data-mode="decks" aria-pressed="false" onclick="switchMode('decks', this)">
                <span class="mode-icon mode-icon-decks"><i class="fas fa-layer-group"></i><span class="mode-count" id="mode-count-decks" hidden></span></span>
                <span>Test Decks</span>
            </button>
            <button class="mode-btn" data-mode="audit" aria-pressed="false" onclick="switchMode('audit', this)">
                <span class="mode-icon mode-icon-audit"><i class="fas fa-microscope"></i><span class="mode-count" id="mode-count-audit" hidden></span></span>
                <span>Combo Audit</span>
            </button>
        </div>

        <div class="admin-content-col">
        <div id="mode-combos">
            <div class="tab-bar">
                <button class="tab-btn active" data-group="combos" onclick="switchTab('combos', 'pending', this)">
                    <i class="fas fa-clock" style="margin-right:0.35rem;"></i>Pending
                    <span id="pending-count-combos" style="margin-left:0.35rem;opacity:0.6;"></span>
                </button>
                <button class="tab-btn" data-group="combos" onclick="switchTab('combos', 'approved', this)">
                    <i class="fas fa-check-circle" style="margin-right:0.35rem;"></i>Approved
                </button>
                <button class="tab-btn" data-group="combos" onclick="switchTab('combos', 'rejected', this)">
                    <i class="fas fa-times-circle" style="margin-right:0.35rem;"></i>Rejected
                </button>
            </div>
            <div id="tab-combos-pending"></div>
            <div id="tab-combos-approved" style="display:none;"></div>
            <div id="tab-combos-rejected" style="display:none;"></div>
        </div>

        <div id="mode-links" style="display:none;">
            <div class="tab-bar">
                <button class="tab-btn active" data-group="links" onclick="switchTab('links', 'pending', this)">
                    <i class="fas fa-clock" style="margin-right:0.35rem;"></i>Pending
                    <span id="pending-count-links" style="margin-left:0.35rem;opacity:0.6;"></span>
                </button>
                <button class="tab-btn" data-group="links" onclick="switchTab('links', 'approved', this)">
                    <i class="fas fa-check-circle" style="margin-right:0.35rem;"></i>Approved
                </button>
                <button class="tab-btn" data-group="links" onclick="switchTab('links', 'rejected', this)">
                    <i class="fas fa-times-circle" style="margin-right:0.35rem;"></i>Rejected
                </button>
            </div>
            <div id="tab-links-pending"></div>
            <div id="tab-links-approved" style="display:none;"></div>
            <div id="tab-links-rejected" style="display:none;"></div>
        </div>

        <div id="mode-reasons" style="display:none;">
            <div class="tab-bar">
                <button class="tab-btn active" data-group="reasons" onclick="switchTab('reasons', 'pending', this)">
                    <i class="fas fa-clock" style="margin-right:0.35rem;"></i>Pending
                    <span id="pending-count-reasons" style="margin-left:0.35rem;opacity:0.6;"></span>
                </button>
                <button class="tab-btn" data-group="reasons" onclick="switchTab('reasons', 'approved', this)">
                    <i class="fas fa-check-circle" style="margin-right:0.35rem;"></i>Approved
                </button>
                <button class="tab-btn" data-group="reasons" onclick="switchTab('reasons', 'rejected', this)">
                    <i class="fas fa-times-circle" style="margin-right:0.35rem;"></i>Rejected
                </button>
            </div>
            <div id="tab-reasons-pending"></div>
            <div id="tab-reasons-approved" style="display:none;"></div>
            <div id="tab-reasons-rejected" style="display:none;"></div>
        </div>

        <div id="mode-sections" style="display:none;">
            <div class="tab-bar">
                <button class="tab-btn active" data-group="sections" onclick="switchTab('sections', 'pending', this)">
                    <i class="fas fa-clock" style="margin-right:0.35rem;"></i>Pending
                    <span id="pending-count-sections" style="margin-left:0.35rem;opacity:0.6;"></span>
                </button>
                <button class="tab-btn" data-group="sections" onclick="switchTab('sections', 'approved', this)">
                    <i class="fas fa-check-circle" style="margin-right:0.35rem;"></i>Approved
                </button>
                <button class="tab-btn" data-group="sections" onclick="switchTab('sections', 'rejected', this)">
                    <i class="fas fa-times-circle" style="margin-right:0.35rem;"></i>Rejected
                </button>
            </div>
            <div id="tab-sections-pending"></div>
            <div id="tab-sections-approved" style="display:none;"></div>
            <div id="tab-sections-rejected" style="display:none;"></div>
        </div>

        <!-- Test Decks: read-only view of assets/data/decklists/report.json (scripts/check-decklists.js). -->
        <div id="mode-decks" style="display:none;">
            <div id="decks-body"></div>
        </div>

        <!-- Combo Audit: OCGCore Wasm diagnostics + interactive DuelSimulator inspector -->
        <div id="mode-audit" style="display:none;">
            <div id="audit-body"></div>
        </div>
        </div><!-- /.admin-content-col -->
      </div><!-- /.admin-layout -->
    </div>
</div>

<script src="../assets/js/admin.js"></script>
</body>

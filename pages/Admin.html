<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Archetype Nexus</title>

    <script src="../assets/js/google-analytics.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/auth.js"></script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="../assets/css/replay-analyzer.css">
    <link rel="stylesheet" href="../assets/css/cookie-consent.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color, #0a0a0a);
            color: var(--text-color, #f5f5f5);
            min-height: 100vh;
            padding: 4rem 1rem 3rem;
        }
        .admin-wrap {
            max-width: 860px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .admin-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
        }
        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .tab-btn {
            padding: 0.45rem 1rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: #a3a3a3;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .tab-btn.active {
            background: rgba(245,158,11,0.15);
            border-color: rgba(245,158,11,0.4);
            color: #f59e0b;
        }
        .combo-admin-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 0.875rem;
            padding: 1.1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .combo-admin-card-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .combo-admin-meta {
            flex: 1;
            min-width: 0;
        }
        .combo-admin-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #f5f5f5;
            margin-bottom: 0.2rem;
        }
        .combo-admin-sub {
            font-size: 0.78rem;
            color: #737373;
        }
        .combo-admin-sub span {
            color: #a3a3a3;
        }
        .meta-strip {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .mbadge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 0.4rem;
        }
        .mbadge-win  { background: rgba(34,197,94,0.15); color:#4ade80; border:1px solid rgba(34,197,94,0.3); }
        .mbadge-loss { background: rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
        .mbadge-tag  { background: rgba(255,255,255,0.06); color:#a3a3a3; border:1px solid rgba(255,255,255,0.1); }
        .mbadge-otk  { background: rgba(168,85,247,0.15); color:#c084fc; border:1px solid rgba(168,85,247,0.3); }
        .action-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-approve {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.35);
            color: #4ade80;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-reject {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-unapprove {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            color: #f59e0b;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }
        .modnotes-input {
            flex: 1;
            min-width: 180px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0.5rem;
            color: #f5f5f5;
            font-size: 0.8rem;
            padding: 0.4rem 0.65rem;
            font-family: inherit;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #525252;
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
    </style>
</head>
<body>

<div class="admin-wrap">
    <div class="admin-header">
        <h1><i class="fas fa-shield-alt" style="color:#f59e0b;margin-right:0.6rem;"></i>Combo Guide Admin</h1>
        <a href="../index.html" style="color:#a3a3a3;font-size:0.82rem;text-decoration:none;">
            <i class="fas fa-arrow-left" style="margin-right:0.35rem;"></i>Back to site
        </a>
    </div>

    <div id="access-denied" style="display:none;text-align:center;padding:4rem 1rem;color:#f87171;">
        <i class="fas fa-lock" style="font-size:2.5rem;margin-bottom:1rem;display:block;"></i>
        <p style="font-size:1rem;">Access denied. Moderator role required.</p>
    </div>

    <div id="admin-content" style="display:none;">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('pending', this)">
                <i class="fas fa-clock" style="margin-right:0.35rem;"></i>Pending
                <span id="pending-count" style="margin-left:0.35rem;opacity:0.6;"></span>
            </button>
            <button class="tab-btn" onclick="switchTab('approved', this)">
                <i class="fas fa-check-circle" style="margin-right:0.35rem;"></i>Approved
            </button>
            <button class="tab-btn" onclick="switchTab('rejected', this)">
                <i class="fas fa-times-circle" style="margin-right:0.35rem;"></i>Rejected
            </button>
        </div>

        <div id="tab-pending"></div>
        <div id="tab-approved" style="display:none;"></div>
        <div id="tab-rejected" style="display:none;"></div>
    </div>
</div>

<script src="../assets/js/admin.js"></script>
</body>
</html>

<!-- Custom Yu-Gi-Oh! Themed SVG Icons for Replay Analyzer -->
<!-- These replace generic emojis with more stylized, gaming-themed icons -->

<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  
  <!-- Starter Icon - Power ignition / key turning -->
  <symbol id="icon-starter" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="starterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path fill="url(#starterGrad)" d="M12 2L4 6v6c0 5.5 3.5 10.7 8 12 4.5-1.3 8-6.5 8-12V6l-8-4zm0 4l2 4h4l-3.5 3 1.5 5-4-2.5L8 18l1.5-5L6 10h4l2-4z"/>
  </symbol>

  <!-- Extender Icon - Chain link / combo connector -->
  <symbol id="icon-extender" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="extenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path fill="url(#extenderGrad)" d="M3.5 12C3.5 10.1 5 8.5 6.9 8.5c.6 0 1.2.2 1.7.5l1.5-1.4c-.9-.7-2-1.1-3.2-1.1C3.7 6.5 1 9.2 1 12.5s2.7 6 6.9 6c1.2 0 2.3-.4 3.2-1.1l-1.5-1.4c-.5.3-1.1.5-1.7.5-1.9 0-3.4-1.6-3.4-3.5zm17 .5c0-3.3-2.7-6-6-6-1.2 0-2.3.4-3.2 1.1l1.5 1.4c.5-.3 1.1-.5 1.7-.5 1.9 0 3.4 1.6 3.4 3.5s-1.5 3.5-3.4 3.5c-.6 0-1.2-.2-1.7-.5l-1.5 1.4c.9.7 2 1.1 3.2 1.1 3.3 0 6-2.7 6-6z"/>
    <circle cx="12" cy="12" r="2" fill="url(#extenderGrad)"/>
  </symbol>

  <!-- Searcher Icon - Radar/target sweep -->
  <symbol id="icon-searcher" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="searcherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path fill="url(#searcherGrad)" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm0-14c-3.3 0-6 2.7-6 6h2c0-2.2 1.8-4 4-4V6zm0 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
    <path fill="url(#searcherGrad)" d="M12 12l6.4-6.4c.4.8.6 1.8.6 2.9L12 12z" opacity="0.6"/>
  </symbol>

  <!-- Breaker Icon - Explosion/destroy -->
  <symbol id="icon-breaker" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="breakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
      </linearGradient>
    </defs>
    <polygon fill="url(#breakerGrad)" points="12,2 14.5,9 22,9.5 16,14 18,22 12,17.5 6,22 8,14 2,9.5 9.5,9"/>
    <polygon fill="#fff" opacity="0.3" points="12,6 13.5,10.5 18,10.7 14.5,13.5 15.8,18 12,15 8.2,18 9.5,13.5 6,10.7 10.5,10.5"/>
  </symbol>

  <!-- Warning Icon - Alert triangle -->
  <symbol id="icon-warning" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path fill="url(#warningGrad)" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
  </symbol>

  <!-- Dice Icon - Opening hand randomness -->
  <symbol id="icon-dice" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect x="3" y="3" width="18" height="18" rx="3" fill="url(#diceGrad)"/>
    <circle cx="8" cy="8" r="1.5" fill="#fff"/>
    <circle cx="16" cy="8" r="1.5" fill="#fff"/>
    <circle cx="12" cy="12" r="1.5" fill="#fff"/>
    <circle cx="8" cy="16" r="1.5" fill="#fff"/>
    <circle cx="16" cy="16" r="1.5" fill="#fff"/>
  </symbol>

  <!-- Tags Icon - Technical analysis -->
  <symbol id="icon-tags" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="tagsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path fill="url(#tagsGrad)" d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/>
    <path fill="url(#tagsGrad)" opacity="0.6" d="M22.3 12.46l-9-9c-.35-.35-.78-.54-1.23-.58l1.35 1.35 8.5 8.5c.37.37.58.87.58 1.42s-.21 1.05-.58 1.41l-6.29 6.29 1.41 1.41 5.26-5.26c.78-.78.78-2.05 0-2.83l-.01-.01z"/>
  </symbol>

  <!-- Book Icon - Deck lists -->
  <symbol id="icon-deck" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#67e8f9;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path fill="url(#deckGrad)" d="M3 5v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5c-1.11 0-2 .9-2 2zm4 2h3v3H7V7zm0 4h3v3H7v-3zm0 4h3v3H7v-3zm7 0h3v3h-3v-3zm0-4h3v3h-3v-3zm0-4h3v3h-3V7z"/>
  </symbol>

  <!-- God Hand Icon - Crown/radiant star -->
  <symbol id="icon-godhand" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="godhandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <polygon fill="url(#godhandGrad)" filter="url(#glow)" points="12,1 15,9 24,9 17,15 20,24 12,18 4,24 7,15 0,9 9,9"/>
    <circle cx="12" cy="12" r="3" fill="#fff" opacity="0.5"/>
  </symbol>

  <!-- Good Icon - Checkmark shield -->
  <symbol id="icon-good" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path fill="url(#goodGrad)" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
  </symbol>

  <!-- Average Icon - Balance scale -->
  <symbol id="icon-average" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="avgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect x="11" y="3" width="2" height="18" fill="url(#avgGrad)"/>
    <rect x="4" y="11" width="16" height="2" fill="url(#avgGrad)"/>
    <circle cx="6" cy="12" r="3" fill="url(#avgGrad)" opacity="0.7"/>
    <circle cx="18" cy="12" r="3" fill="url(#avgGrad)" opacity="0.7"/>
  </symbol>

  <!-- Brick Icon - Stacked bricks -->
  <symbol id="icon-brick" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect x="2" y="4" width="9" height="4" rx="0.5" fill="url(#brickGrad)"/>
    <rect x="13" y="4" width="9" height="4" rx="0.5" fill="url(#brickGrad)"/>
    <rect x="5" y="10" width="9" height="4" rx="0.5" fill="url(#brickGrad)"/>
    <rect x="16" y="10" width="6" height="4" rx="0.5" fill="url(#brickGrad)"/>
    <rect x="2" y="10" width="2" height="4" rx="0.5" fill="url(#brickGrad)"/>
    <rect x="2" y="16" width="9" height="4" rx="0.5" fill="url(#brickGrad)"/>
    <rect x="13" y="16" width="9" height="4" rx="0.5" fill="url(#brickGrad)"/>
  </symbol>

  <!-- Unplayable Icon - Broken card -->
  <symbol id="icon-unplayable" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="unplayableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path fill="url(#unplayableGrad)" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z"/>
    <path fill="url(#unplayableGrad)" d="M16.59 7.41L12 12l-4.59-4.59L6 8.83l4.59 4.59L6 18l1.41 1.41L12 14.83l4.59 4.58L18 18l-4.59-4.58L18 8.83z"/>
  </symbol>

  <!-- OTK Icon - Flame sword -->
  <symbol id="icon-otk" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="otkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#ef4444;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
      </linearGradient>
      <filter id="fireGlow">
        <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <path fill="url(#otkGrad)" filter="url(#fireGlow)" d="M13.5 0.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/>
  </symbol>

</svg>

name: Weekly Banlist & Genesys Points Update

on:
  schedule:
    # Runs automatically every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Data Update Script
        run: node scripts/update-genesys-points.js

      # Rebuilds the Extra Deck packages that "auto" test decks fill from, ordered
      # by YGOProDeck's views this week (history in scripts/data/). If the API is
      # down it keeps last week's packages.
      - name: Build Extra Deck Packages
        run: node scripts/build-extra-packages.js

      # Re-checks every test deck (assets/data/decklists) against the banlist just
      # fetched. report.json lists what needs fixing or a review; it only changes,
      # and so only gets committed below, when the findings change.
      - name: Check Test Decks
        run: node scripts/check-decklists.js --report assets/data/decklists/report.json --no-fail

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if any data files changed
          git add assets/data/
          if [ -d scripts/data ]; then git add scripts/data/; fi
          if git diff --cached --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            echo "Data changes detected. Committing and pushing..."
            git commit -m "chore(data): auto-update banlist, genesys points and Extra Deck packages [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

name: Weekly Banlist, Genesys Points & Combo Audit Update

on:
  schedule:
    # Runs automatically every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Prevent overlapping runs of this workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # The duel engine's card data (cards.cdb + card scripts) is committed from the
      # local setup, so CI gives the same verdicts. It used to live in an actions/cache
      # that each run restored and wrote back: rows a bug had overwritten stayed there,
      # and scripts fetched from ProjectIgnis master at different times didn't match
      # each other or the pinned engine core (127 false flags on 2026-11-08, 0 locally).
      # Without this data the engine would quietly download fresh copies instead.
      - name: Check Committed Card Data
        run: |
          test -s assets/data/cards.cdb || { echo "::error::assets/data/cards.cdb is missing: commit it from a local audit run"; exit 1; }
          test -s assets/data/cardscripts/utility.lua || { echo "::error::assets/data/cardscripts is missing: commit it from a local audit run"; exit 1; }
          echo "Card scripts: $(find assets/data/cardscripts -name 'c*.lua' | wc -l)"

      - name: Run Data Update Script
        run: node scripts/update-genesys-points.js

      # Rebuilds the Extra Deck packages that "auto" test decks fill from, ordered
      # by YGOProDeck's views this week (history in scripts/data/). If the API is
      # down it keeps last week's packages.
      - name: Build Extra Deck Packages
        run: node scripts/build-extra-packages.js

      # Re-checks every test deck (assets/data/decklists) against the banlist just
      # fetched. report.json lists what needs fixing or a review; it only changes,
      # and so only gets committed below, when the findings change.
      - name: Check Test Decks
        run: node scripts/check-decklists.js --report assets/data/decklists/report.json --no-fail

      # Validates all curated JSON combos (assets/data/combos/*.json) and HTML written
      # combo walkthroughs (pages/*.html) against the headless OCGCore engine, then
      # rebuilds the unified audit report (assets/data/combos/engine-audit-report.json).
      - name: Validate Curated JSON Combos
        run: node scripts/verify-combo-jsons.mjs --all --no-fail

      # The v2 replay drafts (not live yet), into their own report: the admin audit
      # shows how each was checked (its recorded duel, or step by step)
      - name: Validate v2 Replay Drafts
        run: node scripts/verify-combo-jsons.mjs --dir=assets/data/combos/v2-drafts --all --v2-only --no-fail

      - name: Validate HTML Guide Combos
        run: node scripts/verify-html-combos-engine.mjs --all

      - name: Build Unified Combo Audit Report
        run: node scripts/build-engine-audit-report.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          branch=$(git rev-parse --abbrev-ref HEAD)

          # Card data the engine had to fetch during this run (cards or scripts the
          # committed set lacks) is not committed: the local copy stays the only source.
          # Running the audit locally and committing its card data fills the gap.
          fetched=$(git status --porcelain -- assets/data/cards.cdb assets/data/cardscripts | wc -l)
          if [ "$fetched" -gt 0 ]; then
            echo "::warning::The audit fetched $fetched card data file(s) missing from the committed set; their combos may differ from a local run. Run the audit locally and commit assets/data/cards.cdb and assets/data/cardscripts."
            git status --porcelain -- assets/data/cards.cdb assets/data/cardscripts | head -20
            git checkout -- assets/data/cards.cdb assets/data/cardscripts
            git clean -fdq -- assets/data/cardscripts
          fi

          if git diff --quiet --exit-code -- assets/data/ scripts/data/ scripts/ILLEGAL_COMBOS_AUDIT.md; then
            echo "No data changes detected. Everything is up to date."
            exit 0
          fi

          echo "Data changes detected. Committing and pushing..."
          git add assets/data/ scripts/ILLEGAL_COMBOS_AUDIT.md
          if [ -d scripts/data ]; then git add scripts/data/; fi
          git commit -m "chore(data): auto-update banlist, genesys points, Extra Deck packages, and combo audit [skip ci]"

          git fetch origin "$branch"

          # Try a standard rebase first; if it conflicts on generated data files, 
          # fallback to preferring our freshly generated files (-X theirs).
          if git rebase "origin/$branch"; then
            git push origin "$branch"
          else
            echo "Standard rebase conflicted. Retrying rebase preferring freshly generated data..."
            git rebase --abort || true
            if git rebase -X theirs "origin/$branch"; then
              git push origin "$branch"
            else
              echo "Rebase failed even with auto-resolution. Aborting and exiting."
              git rebase --abort || true
              exit 1
            fi
          fi